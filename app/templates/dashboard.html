<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jane Aerospace — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --b950: #060f1e;
      --b900: #0b1f3a;
      --b800: #0f2847;
      --b700: #1a3360;
      --b600: #1a56db;
      --b500: #2563eb;
      --b400: #3b82f6;
      --b100: #dbeafe;
      --b50: #eff6ff;
      --ink: #0f172a;
      --ink2: #1e293b;
      --mut: #64748b;
      --mut2: #94a3b8;
      --line: #e2e8f0;
      --bd: #e2e8f0;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
      --bg: #eef2f8;
      --bg2: #f8fafc;
      --card: #ffffff;
      --r: 12px;
      --sh: 0 1px 3px rgba(10, 25, 60, .06), 0 4px 16px rgba(10, 25, 60, .07);
      --sh2: 0 8px 32px rgba(10, 25, 60, .14);
      --sidebar-w: 240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    svg.ic {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -3px;
      flex: none;
    }

    button {
      font-family: inherit;
    }

    a {
      color: var(--b600);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .05em;
    }

    /* ---------------- login ---------------- */
    #login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: var(--b950);
      background-image:
        radial-gradient(ellipse 900px 600px at 70% -5%, rgba(37, 99, 235, .4) 0%, transparent 65%),
        radial-gradient(ellipse 600px 400px at 10% 90%, rgba(124, 58, 237, .25) 0%, transparent 60%);
    }

    .login-card {
      background: #fff;
      border-radius: 18px;
      padding: 40px 44px;
      width: 400px;
      max-width: 92vw;
      box-shadow: 0 32px 80px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .05);
    }

    .login-card h1 {
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
      margin: 18px 0 5px;
      letter-spacing: -.01em;
    }

    .login-card .sub {
      font-size: 12.5px;
      color: var(--mut);
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .fld {
      margin-bottom: 14px;
    }

    .fld label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }

    .fld input,
    .fld select,
    .fld textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      font-size: 14px;
      background: #fff;
    }

    .fld input:focus,
    .fld select:focus,
    .fld textarea:focus {
      outline: none;
      border-color: var(--b600);
      box-shadow: 0 0 0 3px rgba(26, 86, 219, .12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 16px;
      font-size: 12.5px;
      font-family: inherit;
      transition: all .14s;
      white-space: nowrap;
    }

    .btn:hover {
      filter: brightness(1.07);
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-p {
      background: var(--b500);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, .3);
    }

    .btn-p:hover {
      background: var(--b600);
      box-shadow: 0 4px 14px rgba(37, 99, 235, .4);
    }

    .btn-g {
      background: var(--ok);
      color: #fff;
      box-shadow: 0 2px 8px rgba(22, 163, 74, .25);
    }

    .btn-r {
      background: #fff;
      color: var(--bad);
      border: 1.5px solid #fca5a5;
    }

    .btn-r:hover {
      background: #fef2f2;
    }

    .btn-o {
      background: #fff;
      color: var(--ink2);
      border: 1.5px solid var(--line);
    }

    .btn-o:hover {
      background: var(--bg);
      border-color: #94a3b8;
    }

    .btn-w {
      background: #fff;
      color: var(--warn);
      border: 1.5px solid #fde68a;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 14px;
    }

    #login-err {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      font-size: 12.5px;
      padding: 10px 13px;
      border-radius: 8px;
      margin: 6px 0 12px;
      border: 1px solid #fecaca;
    }

    /* ---------------- shell ---------------- */
    #app {
      display: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: var(--b950);
      color: #c5d4ec;
      display: flex;
      flex-direction: column;
      z-index: 20;
      border-right: 1px solid rgba(255, 255, 255, .05);
    }

    .sidebar .logo {
      padding: 20px 18px 16px;
      color: #fff;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      display: flex;
      align-items: center;
      gap: 11px;
      letter-spacing: .04em;
      font-weight: 800;
    }

    .sidebar .logo .logo-sub {
      font-size: 9.5px;
      font-weight: 500;
      color: #6a84b0;
      display: block;
      letter-spacing: .08em;
      margin-top: 1px;
    }

    .nav {
      flex: 1;
      padding: 10px 10px;
      overflow-y: auto;
    }

    .nav-section-label {
      font-size: 9.5px;
      font-weight: 700;
      color: #3d5a8a;
      text-transform: uppercase;
      letter-spacing: .1em;
      padding: 14px 14px 6px;
      display: block;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      color: #7d9ac8;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 1px;
      transition: background .12s, color .12s;
      position: relative;
    }

    .nav a:hover {
      background: rgba(255, 255, 255, .06);
      color: #c5d4ec;
    }

    .nav a.active {
      background: rgba(26, 86, 219, .2);
      color: #fff;
      font-weight: 600;
    }

    .nav a.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 5px;
      bottom: 5px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--b400);
    }

    .nav .badge {
      margin-left: auto;
      background: #ef4444;
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      border-radius: 99px;
      padding: 2px 7px;
      line-height: 1.2;
    }

    .who {
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, .12);
    }

    .who .av {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--b500), #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex: none;
      letter-spacing: .02em;
    }

    .who b {
      color: #e2eaf6;
      display: block;
      font-size: 12px;
      font-weight: 600;
    }

    .who span {
      color: #5a78a8;
      font-size: 10.5px;
    }

    .who button {
      background: none;
      border: none;
      color: #3d5a8a;
      cursor: pointer;
      margin-left: auto;
      padding: 6px;
      border-radius: 6px;
      transition: color .12s, background .12s;
    }

    .who button:hover {
      color: #fff;
      background: rgba(255, 255, 255, .08);
    }

    /* ── topbar ── */
    .topbar {
      position: fixed;
      left: var(--sidebar-w);
      right: 0;
      top: 0;
      height: 58px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      z-index: 15;
    }

    .topbar-left {
      display: flex;
      flex-direction: column;
      margin-right: auto;
    }

    .topbar h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 7px;
      line-height: 1.1;
    }

    .topbar-sub {
      font-size: 11px;
      color: var(--mut);
      margin-top: 1px;
      font-weight: 400;
    }

    .gsearch {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 9px;
      padding: 7px 12px;
      width: 260px;
      color: var(--mut);
      transition: border-color .15s, box-shadow .15s;
    }

    .gsearch:focus-within {
      border-color: var(--b400);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .1);
    }

    .gsearch input {
      border: none;
      background: none;
      outline: none;
      font-size: 12.5px;
      width: 100%;
      font-family: inherit;
    }

    .main {
      margin-left: var(--sidebar-w);
      padding: 78px 24px 40px;
    }

    /* ── KPI + cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 16px 18px;
      box-shadow: var(--sh);
      display: flex;
      gap: 13px;
      align-items: center;
      border: 1px solid rgba(226, 232, 240, .6);
    }

    .card .ico {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .card .num {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.1;
    }

    .card .lbl {
      font-size: 10.5px;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600;
      margin-top: 1px;
    }

    /* gradient KPI tiles */
    .card.kpi {
      position: relative;
      display: block;
      color: #fff;
      border: none;
      padding: 18px 18px 16px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(15, 23, 42, .18);
      min-height: 118px;
      transition: transform .15s, box-shadow .15s;
    }

    .card.kpi:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(15, 23, 42, .24);
    }

    .card.kpi .kpi-ico {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card.kpi .kpi-ico svg {
      width: 20px;
      height: 20px;
      color: rgba(255, 255, 255, .9);
    }

    .card.kpi .kpi-lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .85;
      padding-right: 50px;
    }

    .card.kpi .kpi-num {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      margin-top: 10px;
      letter-spacing: -.02em;
    }

    .card.kpi .kpi-sub {
      font-size: 11px;
      opacity: .8;
      margin-top: 6px;
      font-weight: 500;
    }

    /* ── panels ── */
    .panel {
      background: var(--card);
      border-radius: var(--r);
      padding: 20px 22px;
      box-shadow: var(--sh);
      margin-bottom: 18px;
      border: 1px solid rgba(226, 232, 240, .5);
    }

    .panel h3 {
      font-size: 11.5px;
      color: var(--ink2);
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h3 {
      margin-bottom: 0;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
    }

    @media(max-width:1100px) {

      .grid2,
      .grid3 {
        grid-template-columns: 1fr;
      }
    }

    /* ── tables ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 10px;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 2px solid var(--line);
      white-space: nowrap;
      background: #f8fafc;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f4fa;
      vertical-align: middle;
    }

    tbody tr {
      transition: background .1s;
    }

    tbody tr:hover {
      background: #f5f8ff;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .c-gray {
      background: #f1f5f9;
      color: #64748b;
    }

    .c-gray-dark {
      background: #e2e8f0;
      color: #374151;
    }

    .c-blue {
      background: var(--b100);
      color: #1e40af;
    }

    .c-green {
      background: #dcfce7;
      color: #15803d;
    }

    .c-amber {
      background: #fef3c7;
      color: #b45309;
    }

    .c-purple {
      background: #ede9fe;
      color: #6d28d9;
    }

    .c-red {
      background: #fee2e2;
      color: #b91c1c;
    }

    .ibtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--mut);
      cursor: pointer;
      margin: 0 2px;
      transition: all .12s;
    }

    .ibtn:hover {
      border-color: var(--b400);
      color: var(--b500);
      background: var(--b50);
    }

    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      border-radius: 99px;
      padding: 2px 5px;
      line-height: 1.2;
      border: 2px solid #fff;
      min-width: 18px;
      text-align: center;
    }

    .steps {
      display: flex;
      gap: 3px;
      margin-top: 5px;
    }

    .step {
      width: 13px;
      height: 5px;
      border-radius: 3px;
      background: #e2e8f0;
    }

    .step.done {
      background: var(--b600);
    }

    /* document pipeline circles */
    .doc-card {
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: box-shadow .15s;
    }

    .doc-card:hover {
      box-shadow: 0 4px 18px rgba(15, 23, 42, .08);
    }

    .doc-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .doc-pipeline {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .dp-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: #fff;
      flex: none;
      transition: background .2s, border-color .2s;
    }

    .dp-dot.done {
      background: #16a34a;
      border-color: #16a34a;
    }

    .dp-dot.active {
      border-color: #1a56db;
      background: #eff6ff;
    }

    .dp-line {
      width: 16px;
      height: 2px;
      background: #e2e8f0;
      flex: none;
      transition: background .2s;
    }

    .dp-line.done {
      background: #16a34a;
    }

    .doc-cols {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .doc-col-lbl {
      font-size: 10px;
      font-weight: 800;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 5px;
    }

    @media(max-width:680px) {
      .doc-cols {
        grid-template-columns: 1fr;
      }
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    .bar-row .bl {
      width: 128px;
      font-size: 12px;
      color: #334155;
      text-align: right;
      flex: none;
    }

    .bar-row .bar {
      flex: 1;
      background: #edf2fa;
      border-radius: 6px;
      height: 22px;
      overflow: hidden;
    }

    .bar-row .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--b600), #4f86f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 22px;
      transition: width .5s;
    }

    .intg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .intg .it {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--b50);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: #1e3a8a;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-left: auto;
      flex: none;
    }

    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 7px rgba(22, 163, 74, .7);
    }

    .dot.off {
      background: var(--bad);
    }

    /* kanban */
    .kanban {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      align-items: stretch;
      height: calc(100vh - 108px);
      padding-bottom: 4px;
    }

    .kcol {
      flex: 1 0 218px;
      min-width: 218px;
      background: #f0f4fa;
      border-radius: 12px;
      padding: 9px;
      display: flex;
      flex-direction: column;
    }

    .khead {
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      flex: none;
      border-top: 3px solid rgba(0, 0, 0, .18);
    }

    .khead .cnt {
      background: rgba(255, 255, 255, .75);
      border-radius: 99px;
      padding: 1px 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .kbody {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .kcard {
      background: #fff;
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(12, 35, 68, .1);
      cursor: pointer;
      transition: transform .1s;
      position: relative;
    }

    .kcard:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(12, 35, 68, .16);
    }

    .kcard b {
      font-size: 12.5px;
      display: block;
      color: var(--ink);
      margin-bottom: 1px;
    }

    .kcard span {
      font-size: 11px;
      color: var(--mut);
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .kact {
      display: none;
      gap: 4px;
      margin-top: 8px;
      border-top: 1px solid #f1f5f9;
      padding-top: 7px;
    }

    .kcard:hover .kact {
      display: flex;
    }

    .kact button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 7px;
      border: 1.5px solid var(--line);
      background: #fff;
      cursor: pointer;
      color: var(--b700);
    }

    .kact button:hover {
      border-color: currentColor;
    }

    .kmeta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    /* calendar */
    .calhead {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .calhead h4 {
      font-size: 16px;
      color: var(--b700);
      min-width: 170px;
      text-align: center;
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .cal .dow {
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--mut);
      text-transform: uppercase;
      padding: 5px 0;
    }

    .day {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      min-height: 86px;
      padding: 7px 8px;
      font-size: 11px;
      position: relative;
    }

    .day .dn {
      font-weight: 700;
      color: #334155;
      font-size: 12px;
    }

    .day.out {
      opacity: .35;
    }

    .day.today {
      border-color: var(--b600);
      box-shadow: 0 0 0 2px rgba(26, 86, 219, .15);
    }

    .day.wkd {
      background: #f8fafc;
    }

    .day.hol {
      background: #fff7ed;
      border-color: #fdba74;
    }

    .day.blk {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .day .tag {
      display: block;
      font-size: 9.5px;
      color: #b45309;
      font-weight: 700;
      margin-top: 1px;
    }

    .day .bk {
      display: block;
      background: var(--b600);
      color: #fff;
      border-radius: 5px;
      padding: 2px 5px;
      margin-top: 3px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day .sl {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      border-radius: 5px;
      padding: 1px 5px;
      margin-top: 3px;
      font-size: 9.5px;
      font-weight: 700;
    }

    .day .blkbtn {
      position: absolute;
      top: 5px;
      right: 6px;
      border: none;
      background: none;
      color: #cbd5e1;
      cursor: pointer;
      padding: 1px;
    }

    .day .blkbtn:hover {
      color: var(--bad);
    }

    /* ── drawer ── */
    #drawer-wrap {
      position: fixed;
      inset: 0;
      background: rgba(7, 16, 32, .5);
      z-index: 50;
      display: none;
      backdrop-filter: blur(2px);
    }

    #drawer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 580px;
      max-width: 96vw;
      background: #fff;
      box-shadow: -16px 0 48px rgba(0, 0, 0, .22);
      overflow-y: auto;
      animation: slidein .2s cubic-bezier(.3, 0, .2, 1);
    }

    .drawer-head {
      position: sticky;
      top: 0;
      background: var(--b900);
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      z-index: 2;
    }

    .drawer-head h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex: 1;
    }

    .drawer-head .chip {
      border: 1px solid rgba(255, 255, 255, .2);
    }

    .drawer-body {
      padding: 20px 24px 32px;
    }

    @keyframes slidein {
      from {
        transform: translateX(48px);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    #drawer h2 {
      font-size: 17px;
      color: var(--b700);
    }

    .dsec {
      font-size: 11px;
      font-weight: 800;
      color: var(--b700);
      text-transform: uppercase;
      letter-spacing: .07em;
      border-bottom: 2px solid var(--b100);
      padding-bottom: 6px;
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .kv {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 0;
      font-size: 12.5px;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
    }

    .kv div {
      padding: 7px 11px;
      border-bottom: 1px solid #f1f5f9;
    }

    .kv div:nth-child(4n+1),
    .kv div:nth-child(4n+2) {
      background: #f8fafc;
    }

    .kv .k {
      color: var(--mut);
      font-weight: 600;
    }

    .tl {
      position: relative;
      padding-left: 22px;
    }

    .tl::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--b100);
    }

    .tl .ev {
      position: relative;
      padding: 5px 0 11px;
    }

    .tl .ev::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 9px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--b600);
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px var(--b100);
    }

    .tl .ev b {
      font-size: 12.5px;
      display: block;
    }

    .tl .ev span {
      font-size: 11px;
      color: var(--mut);
    }

    /* modal */
    .modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(12, 35, 68, .5);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px 30px;
      width: 460px;
      max-width: 94vw;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    }

    .modal h3 {
      font-size: 16px;
      color: var(--b700);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .msg {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      margin: 12px 0;
      font-weight: 600;
    }

    .msg.ok {
      background: #dcfce7;
      color: #15803d;
      display: block;
    }

    .msg.err {
      background: #fee2e2;
      color: #b91c1c;
      display: block;
    }

    .seg {
      display: inline-flex;
      background: #edf2fa;
      border-radius: 9px;
      padding: 3px;
    }

    .seg button {
      border: none;
      background: none;
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--mut);
      cursor: pointer;
    }

    .seg button.on {
      background: #fff;
      color: var(--b700);
      box-shadow: 0 1px 4px rgba(12, 35, 68, .15);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: #fff;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .32);
      z-index: 90;
      display: none;
      max-width: 380px;
      border-left: 4px solid var(--b400);
      animation: toast-in .18s ease;
    }

    @keyframes toast-in {
      from {
        transform: translateY(16px);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    /* kebab action menu */
    .menu-wrap {
      position: relative;
      display: inline-block;
    }

    .kebab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: #475569;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1px;
      line-height: 1;
    }

    .kebab:hover {
      border-color: var(--b600);
      color: var(--b600);
      background: var(--b50);
    }

    .menu {
      position: fixed;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      box-shadow: 0 12px 36px rgba(12, 35, 68, .22);
      min-width: 200px;
      z-index: 80;
      padding: 6px;
      display: none;
    }

    .menu a {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      color: #1e293b;
      cursor: pointer;
      text-decoration: none;
    }

    .menu a:hover {
      background: var(--b50);
    }

    .menu a.ok {
      color: var(--ok);
    }

    .menu a.warn {
      color: var(--warn);
    }

    .menu a.danger {
      color: var(--bad);
    }

    .menu .div {
      height: 1px;
      background: #eef2f7;
      margin: 5px 4px;
    }

    /* google-sheet style grid */
    .gs-wrap {
      overflow: auto;
      border: 1px solid #dadce0;
      border-radius: 10px;
      background: #fff;
      max-height: calc(100vh - 220px);
    }

    .gs {
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 100%;
    }

    .gs th {
      position: sticky;
      top: 0;
      background: #f8f9fa;
      border: 1px solid #dadce0;
      padding: 7px 10px;
      font-size: 11px;
      color: #3c4043;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
      z-index: 2;
    }

    .gs td {
      border: 1px solid #e0e3e7;
      padding: 0;
      min-width: 120px;
    }

    .gs td.rn {
      background: #f8f9fa;
      color: #5f6368;
      text-align: center;
      font-size: 11px;
      min-width: 36px;
      width: 36px;
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 2px solid #dadce0;
    }

    .gs td input {
      width: 100%;
      border: none;
      outline: none;
      padding: 7px 10px;
      font-size: 12.5px;
      background: transparent;
      font-family: inherit;
    }

    .gs td input:focus {
      box-shadow: inset 0 0 0 2px var(--b600);
      border-radius: 2px;
    }

    .gs tr.dirty td {
      background: #fffbeb;
    }

    .gs td.act {
      min-width: 84px;
      width: 84px;
      text-align: center;
      background: #fafbfc;
    }

    /* ── extra utilities ── */
    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .view-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-subtitle {
      font-size: 12px;
      color: var(--mut);
      margin-top: 2px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
      color: var(--mut);
      border: 1.5px solid var(--line);
      transition: all .12s;
    }

    .filter-chip:hover,
    .filter-chip.on {
      background: var(--b50);
      color: var(--b600);
      border-color: var(--b400);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 14px 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--mut);
    }

    .empty-state svg {
      width: 44px;
      height: 44px;
      opacity: .3;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 13px;
    }

    .stat-delta {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .stat-delta.up {
      background: #dcfce7;
      color: #15803d;
    }

    .stat-delta.down {
      background: #fee2e2;
      color: #b91c1c;
    }

    .stat-delta.flat {
      background: #f1f5f9;
      color: #64748b;
    }

    @media(max-width:900px) {
      :root {
        --sidebar-w: 62px;
      }

      .sidebar .logo span,
      .sidebar .logo .logo-sub,
      .nav a span,
      .nav-section-label,
      .who div,
      .nav .badge {
        display: none;
      }

      .main {
        padding: 76px 12px 30px;
      }

      .gsearch {
        width: 150px;
      }
    }
  </style>
</head>

<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="logo" style="color:var(--b700);font-size:15px;">
        <svg width="44" height="44" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="22" fill="#1a56db" />
          <path d="M10 30 L38 14 L30 26 L36 30 L26 30 L20 36 L22 28 Z" fill="#fff" />
        </svg>
        <span>JANE AEROSPACE</span>
      </div>
      <h1>Command Center</h1>
      <p class="sub">Outreach · Bookings · KYC · NDA · Agreements — live tracking, approvals and analytics in one place.
      </p>
      <div class="fld"><label>Email</label>
        <input type="email" id="li-email" placeholder="admin@janeaerospace.co.in" autocomplete="username">
      </div>
      <div class="fld"><label>Password</label>
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-err"></div>
      <button class="btn btn-p btn-block" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app">
    <div class="sidebar">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="22" fill="#1a56db" />
          <path d="M10 30 L38 14 L30 26 L36 30 L26 30 L20 36 L22 28 Z" fill="#fff" />
        </svg>
        <div>
          <span>JANE AEROSPACE</span>
          <span class="logo-sub">COMMAND CENTER</span>
        </div>
      </div>
      <div class="nav" id="nav"></div>
      <div class="who">
        <div class="av" id="who-av">A</div>

        <button onclick="logout()" title="Sign out"><svg class="ic" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg></button>
      </div>
    </div>

    <div class="topbar">
      <div class="topbar-left">
        <h2 id="page-title">Overview</h2>
        <span class="topbar-sub" id="topbar-sub"></span>
      </div>
      <div class="gsearch"><svg class="ic" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input id="g-q" placeholder="Search leads, companies…" oninput="globalSearch()">
      </div>

      <div style="position:relative; display:inline-flex; align-items:center; margin-left: 6px;">
        <svg class="ic" viewBox="0 0 24 24" style="position:absolute;left:10px;pointer-events:none;color:var(--mut);">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <select id="ov-time-filter" onchange="handleTimeFilter()"
          style="appearance:none; border:1.5px solid var(--line); border-radius:10px; padding:8.5px 32px; background:#fff; font-size:13px; font-weight:600; color:#475569; cursor:pointer; outline:none; font-family:inherit; transition:all 0.2s;">
          <option value="0">All Time</option>
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="90">Last 90 Days</option>
          <option value="365">Last 1 Year</option>
        </select>
        <svg class="ic" viewBox="0 0 24 24"
          style="position:absolute;right:10px;width:14px;height:14px;pointer-events:none;color:var(--mut);">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>

      <button class="btn btn-p" id="btn-add" onclick="openModal('add')"><svg class="ic" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg> Add Lead</button>
      <div style="position:relative;">
        <button class="btn btn-o" id="notif-btn" onclick="toggleNotifications(event)" title="Notifications"
          style="position:relative;padding:9px 11px;"><svg class="ic" viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg><span id="notif-badge" class="badge" style="display:none;"></span></button>
        <div id="notif-pop"
          style="display:none;position:absolute;top:48px;right:0;width:370px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 52px rgba(10,25,60,.22);z-index:90;">
        </div>
      </div>
      <button class="btn btn-o" onclick="openComments()" title="Lead comments"
        style="position:relative;padding:9px 11px;"><svg class="ic" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg><span id="cmt-badge" class="badge" style="display:none;"></span></button>
      <button class="btn btn-o" onclick="refreshAll()" title="Refresh data" style="padding:9px 11px;"><svg class="ic"
          viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg></button>
    </div>

    <div class="main">
      <div id="view-overview"></div>
      <div id="view-kanban" style="display:none;"></div>
      <div id="view-leads" style="display:none;"></div>
      <div id="view-sheet" style="display:none;"></div>
      <div id="view-bookings" style="display:none;"></div>
      <div id="view-docs" style="display:none;"></div>
      <div id="view-approvals" style="display:none;"></div>
      <div id="view-bulk" style="display:none;"></div>
      <div id="view-logs" style="display:none;"></div>
      <div id="view-users" style="display:none;"></div>
    </div>
  </div>

  <!-- drawer -->
  <div id="drawer-wrap" onclick="if(event.target===this)closeDrawer()">
    <div id="drawer"></div>
  </div>
  <!-- modal -->
  <div class="modal-wrap" id="modal-wrap" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* ============================ core ============================ */
    const API = '/api/v1/dashboard/api';
    let TOKEN = localStorage.getItem('ja_token') || '', ROLE = localStorage.getItem('ja_role') || '',
      NAME = localStorage.getItem('ja_name') || '';
    let LEADS = [], OV = null, CAL = { y: 0, m: 0 }, CHARTS = {};

    const I = {
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',

      cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      doc: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
      check2: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
      send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',

    };
    function ic(n, s) { return `<svg class="ic" ${s ? `style="${s}"` : ''} viewBox="0 0 24 24">${I[n] || ''}</svg>`; }
    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function toast(t, ok = true) {
      const e = document.getElementById('toast'); e.textContent = t;
      e.style.background = ok ? '#0c2344' : '#b91c1c'; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3500);
    }

    async function api(path, opts = {}) {
      opts.headers = Object.assign({
        'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1',
        'Authorization': 'Bearer ' + TOKEN
      }, opts.headers || {});
      const r = await fetch(API + path, opts);
      if (r.status === 401) { logout(); throw new Error('Session expired'); }
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || ('HTTP ' + r.status)); }
      return r.json();
    }

    /* ============================ auth ============================ */
    async function doLogin() {
      const err = document.getElementById('login-err'); err.style.display = 'none';
      try {
        const r = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
          body: JSON.stringify({
            email: document.getElementById('li-email').value.trim(),
            password: document.getElementById('li-pass').value
          })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Login failed');
        TOKEN = d.access_token; ROLE = d.role; NAME = d.full_name;
        localStorage.setItem('ja_token', TOKEN); localStorage.setItem('ja_role', ROLE); localStorage.setItem('ja_name', NAME);
        enterApp();
      } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
    }
    function logout() { localStorage.clear(); TOKEN = ''; location.reload(); }
    const canAct = () => ROLE === 'admin' || ROLE === 'approver';

    function enterApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('who-name').textContent = NAME;
      document.getElementById('who-av').textContent = (NAME || 'U')[0].toUpperCase();
      document.getElementById('who-role').textContent = { admin: 'Administrator', approver: 'Approver', viewer: 'Viewer' }[ROLE] || ROLE;
      if (!canAct()) document.getElementById('btn-add').style.display = 'none';
      buildNav(); nav('overview'); loadLeads(); loadCommentCount(); loadNotifCount();
    }

    const NAVS = [
      ['overview', 'Overview', 'home', 'MAIN'],
      ['kanban', 'Pipeline Board', 'kanban', null],
      ['leads', 'Leads', 'users2', null],
      ['sheet', 'Sheet View', 'table', null],
      ['bookings', 'Bookings', 'cal', 'PIPELINE'],
      ['docs', 'Documents', 'doc', null],
      ['approvals', 'Notifications', 'check2', 'OPERATIONS'],
      ['logs', 'Activity Log', 'clock', null],
      ['users', 'Users', 'shield', 'SYSTEM'],
    ];
    const NAV_SUBS = {
      overview: () => `${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}`,
      kanban: () => `${LEADS.length} leads tracked`,
      leads: () => `${LEADS.filter(l => !l.dropped).length} active leads`,
      sheet: () => 'Live sync with Google Sheets',
      bookings: () => 'Meeting calendar',
      docs: () => `${LEADS.filter(l => l.onboarding).length} onboarding records`,
      approvals: () => 'Pending reviews & alerts',
      logs: () => 'Full audit trail',
      users: () => 'Team access control',
    };
    function buildNav() {
      let html = '';
      NAVS.filter(([v]) => !(v === 'users' && ROLE !== 'admin') && !(v === 'bulk' && !canAct()))
        .forEach(([v, l, i, section]) => {
          if (section) html += `<span class="nav-section-label">${section}</span>`;
          html += `<a data-view="${v}" onclick="nav('${v}')">${ic(i)}<span>${l}</span>${v === 'approvals' ? '<span class="badge" id="apr-badge" style="display:none;"></span>' : ''}</a>`;
        });
      document.getElementById('nav').innerHTML = html;
    }
    function nav(v) {
      document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === v));
      NAVS.forEach(([x]) => { const el = document.getElementById('view-' + x); if (el) el.style.display = x === v ? 'block' : 'none'; });
      const entry = NAVS.find(([x]) => x === v);
      document.getElementById('page-title').innerHTML = ic(entry[2]) + ' ' + entry[1];
      const sub = NAV_SUBS[v]; if (sub) document.getElementById('topbar-sub').textContent = sub();
      ({
        overview: loadOverview, kanban: renderKanban, leads: renderLeadsView, sheet: loadSheet, bookings: loadBookings,
        docs: renderDocs, approvals: loadApprovals, bulk: renderBulk, logs: loadLogs, users: loadUsers
      }[v] || (() => { }))();
    }
    function refreshAll() { loadLeads().then(() => { const v = document.querySelector('.nav a.active'); if (v) nav(v.dataset.view); }); loadCommentCount(); loadNotifCount(); }
    function globalSearch() {
      const a = document.querySelector('.nav a.active');
      if (a && a.dataset.view !== 'leads') nav('leads'); renderLeadsView();
    }
    function handleTimeFilter() {
      const a = document.querySelector('.nav a.active');
      if (a && a.dataset.view !== 'overview') nav('overview'); else loadOverview();
    }

    /* ============================ overview ============================ */
    async function loadOverview() {
      const days = document.getElementById('ov-time-filter') ? document.getElementById('ov-time-filter').value : '0';
      try { OV = await api('/overview?days=' + days); } catch (e) { return; }
      const t = OV.totals;
      const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
      // Gradient KPI tiles — each with gradient, icon, number, label, sub-label
      const kpiDefs = [
        { lbl: 'Total Leads', val: t.leads, sub: 'in the pipeline', icon: 'users2', grad: 'linear-gradient(135deg,#1a56db,#2563eb)' },
        { lbl: 'Engaged', val: t.replied, sub: pct(t.replied, t.leads) + '% reply rate', icon: 'inbox', grad: 'linear-gradient(135deg,#059669,#16a34a)' },
        { lbl: 'Active Deals', val: t.onboarding, sub: pct(t.onboarding, t.leads) + '% conversion', icon: 'zap', grad: 'linear-gradient(135deg,#7c3aed,#a855f7)' },
        { lbl: 'NDAs Signed', val: t.nda_signed, sub: 'documents executed', icon: 'doc', grad: 'linear-gradient(135deg,#0891b2,#06b6d4)' },
        { lbl: 'Deals Won', val: t.agreement_signed, sub: pct(t.agreement_signed, t.leads) + '% win rate', icon: 'check2', grad: 'linear-gradient(135deg,#15803d,#22c55e)' },
        { lbl: 'Action Needed', val: t.pending_approvals, sub: 'pending approvals', icon: 'clock', grad: 'linear-gradient(135deg,#b45309,#d97706)' },
      ];
      document.getElementById('view-overview').innerHTML = `
    <div class="cards">${kpiDefs.map(k => `<div class="card kpi" style="background:${k.grad};">
      <div class="kpi-ico">${ic(k.icon)}</div>
      <div class="kpi-lbl">${k.lbl}</div>
      <div class="kpi-num">${k.val}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('')}</div>
    <div class="grid3">
      <div class="panel"><h3>${ic('chart')} 14-Day Activity</h3><canvas id="ch-bar" height="110"></canvas></div>
      <div class="panel"><h3>${ic('chart')} Lead Status Split</h3><canvas id="ch-pie" height="110"></canvas></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>${ic('zap')} Conversion Funnel</h3><div id="ov-funnel"></div></div>
      <div class="panel"><h3>${ic('link')} Integrations</h3><div class="intg" id="ov-intg"></div>
        <p style="font-size:11px;color:var(--mut);margin-top:12px;">Sheet: <b>${esc(OV.sheet_name)}</b> · Updated ${esc(OV.generated_at)}</p></div>
    </div>`;
      // Business conversion funnel: each stage as a % of total leads.
      const cf = [['Leads', t.leads], ['Engaged', t.replied], ['Active Deals', t.onboarding], ['NDAs Signed', t.nda_signed], ['Deals Won', t.agreement_signed]];
      const cmax = Math.max(t.leads, 1);
      document.getElementById('ov-funnel').innerHTML = cf.map(s => {
        const v = s[1] || 0, of = Math.round(v / cmax * 100);
        return `<div class="bar-row"><div class="bl">${esc(s[0])}</div><div class="bar">
     <div class="fill" style="width:${Math.max(of, v ? 8 : 0)}%">${v} · ${of}%</div></div></div>`;
      }).join('');
      document.getElementById('ov-intg').innerHTML = Object.entries(OV.integrations).map(([k, v]) =>
        `<div class="it">${ic('link', 'width:14px;height:14px;')}<span>${esc(k)}</span><span class="dot ${v ? 'on' : 'off'}"></span></div>`).join('');
      const badge = document.getElementById('apr-badge');
      if (badge) { badge.style.display = t.pending_approvals ? 'inline-block' : 'none'; badge.textContent = t.pending_approvals; }
      drawCharts();
    }
    function drawCharts() {
      if (typeof Chart === 'undefined' || !OV) return;
      Object.values(CHARTS).forEach(c => c.destroy()); CHARTS = {};
      const days = Object.keys(OV.daily), lbl = days.map(d => d.slice(5));
      CHARTS.bar = new Chart(document.getElementById('ch-bar'), {
        type: 'bar',
        data: {
          labels: lbl, datasets: [
            { label: 'Emails', data: days.map(d => OV.daily[d].sent), backgroundColor: '#1a56db', borderRadius: 4 },
            { label: 'Replies', data: days.map(d => OV.daily[d].replied), backgroundColor: '#16a34a', borderRadius: 4 },
            { label: 'Bookings', data: days.map(d => OV.daily[d].booked), backgroundColor: '#d97706', borderRadius: 4 }]
        },
        options: {
          responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11 } } } },
          scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10 } } } }
        }
      });
      const st = OV.by_status, keys = Object.keys(st);
      const colors = {
        NEW: '#94a3b8', SENT: '#1a56db', REPLIED: '#16a34a', BOOKED: '#d97706', FAILED: '#dc2626',
        INVALID_EMAIL: '#7c3aed', JOB_CHANGED: '#0891b2'
      };
      CHARTS.pie = new Chart(document.getElementById('ch-pie'), {
        type: 'doughnut',
        data: { labels: keys, datasets: [{ data: keys.map(k => st[k]), backgroundColor: keys.map(k => colors[k] || '#64748b'), borderWidth: 2 }] },
        options: { responsive: true, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11 } } } } }
      });
    }

    /* ============================ leads ============================ */
    async function loadLeads() { try { LEADS = await api('/leads'); } catch (e) { LEADS = []; } return LEADS; }
    // One status -> colour system used everywhere (green=done, amber=in-progress,
    // blue=sent/active, red=problem, grey=none). No stray colours.
    function chip(s) {
      const m = {
        NEW: 'c-gray', SENT: 'c-blue', REPLIED: 'c-green', BOOKED: 'c-green', FAILED: 'c-red',
        PENDING: 'c-gray', FORM_SENT: 'c-amber', SUBMITTED: 'c-amber', UNDER_REVIEW: 'c-amber', APPROVED: 'c-green',
        REJECTED: 'c-red', TEAM_REVIEW: 'c-amber', DRAFT_GENERATED: 'c-amber', SENT_TO_LEAD: 'c-blue',
        SIGNED_RECEIVED: 'c-amber', SIGN_UNDER_REVIEW: 'c-amber', PROCEED_NEXT: 'c-green', SIGN_REJECTED: 'c-red',
        DRAFT_REJECTED: 'c-red', COMPLETED: 'c-green', DROPPED: 'c-red', INVALID_EMAIL: 'c-red', JOB_CHANGED: 'c-amber'
      };
      return `<span class="chip ${m[s] || 'c-gray'}">${esc(s || '—')}</span>`;
    }
    function steps(i) { let h = '<div class="steps">'; for (let k = 0; k < 10; k++)h += `<div class="step ${k <= i && i > 0 ? 'done' : ''}"></div>`; return h + '</div>'; }

    function renderLeadsView() {
      const q = (document.getElementById('g-q').value || '').toLowerCase();
      const rows = LEADS.filter(l => !q || l.email.toLowerCase().includes(q) || (l.company || '').toLowerCase().includes(q));
      const active = rows.filter(l => !l.dropped).length;
      document.getElementById('view-leads').innerHTML = `
    <div class="view-header">
      <div>
        <div class="view-title">${ic('users2')} All Leads</div>
        <div class="view-subtitle">${active} active · ${rows.length - active} dropped${q ? ` · filtered: "${esc(q)}"` : ''}</div>
      </div>
      ${canAct() ? `<button class="btn btn-p" onclick="openModal('add')">${ic('plus')} Add Lead</button>` : ''}
    </div>
    <div class="panel" style="overflow-x:auto;padding:0;">
    <table><thead><tr>
      <th style="width:40px;"></th>
      <th>Company / Lead</th>
      <th>Pipeline Stage</th>
      <th>Outreach</th>
      <th>Reply</th>
      <th>Booking</th>
      <th style="width:48px;"></th>
    </tr></thead>
    <tbody>${rows.map(l => `<tr ${l.dropped ? 'style="opacity:.45;"' : ''}>
      <td style="padding:8px 10px;"><button class="ibtn" title="View details" onclick="openDrawer('${l.lead_id}')">${ic('eye')}</button></td>
      <td style="min-width:200px;">
        <div style="font-weight:700;font-size:13px;color:var(--ink);">${esc(l.company)}</div>
        <div style="color:var(--mut);font-size:11.5px;margin-top:2px;">${esc(l.email)}</div>
        ${l.phone ? `<div style="color:var(--mut2);font-size:11px;">${esc(l.phone)}</div>` : ''}
        ${l.dropped ? '<span class="chip c-red" style="margin-top:3px;">DROPPED</span>' : ''}
      </td>
      <td>
        <span class="chip c-blue" style="margin-bottom:4px;">${esc(l.stage)}</span>
        ${steps(l.stage_index)}
      </td>
      <td style="font-size:12px;color:var(--ink2);">${esc(l.sent_at) || '<span style="color:var(--mut2);">—</span>'}
        ${l.followups ? `<br><span class="chip c-gray" style="font-size:9.5px;margin-top:3px;">+${l.followups} follow-ups</span>` : ''}</td>
      <td style="font-size:12px;color:var(--ink2);">${esc(l.replied_at) || '<span style="color:var(--mut2);">—</span>'}</td>
      <td style="font-size:12px;color:var(--ink2);">${esc(l.booked_at) || '<span style="color:var(--mut2);">—</span>'}
        ${l.selected_slot ? `<br><span style="font-size:10.5px;color:var(--mut);">${esc(l.selected_slot)}</span>` : ''}
        ${l.meeting_link ? `<br><a href="${esc(l.meeting_link)}" target="_blank" style="font-size:11px;font-weight:700;color:var(--b500);">🔗 Join ↗</a>` : ''}</td>
      <td style="padding:8px 10px;">${leadActionBtns(l)}</td>
    </tr>`).join('') ||
        '<tr><td colspan="7" style="text-align:center;color:var(--mut);padding:40px 20px;">No leads found</td></tr>'}
    </tbody></table></div>`;
    }
    function leadActionBtns(l) {
      return `<button class="kebab" onclick="openLeadMenu(event,'${l.lead_id}')" title="Actions">⋮</button>`;
    }
    function openLeadMenu(ev, id) {
      ev.stopPropagation();
      closeMenus();
      const l = LEADS.find(x => x.lead_id === id); if (!l) return;
      let items = `<a onclick="closeMenus();openDrawer('${id}')">${ic('eye')} View Full Details</a>`;
      if (canAct()) {
        items += `<div class="div"></div>`;
        if (!l.onboarding) items += `<a class="ok" onclick="closeMenus();leadAction('${id}','start_onboarding')">${ic('play')} Start Onboarding</a>`;
        else {
          items += `<a class="warn" onclick="closeMenus();leadAction('${id}','cancel_onboarding')">${ic('x')} Cancel Onboarding</a>`;
          items += `<a href="${l.onboarding.nda_edit_url}" target="_blank" onclick="closeMenus()">${ic('edit')} Open NDA Editor</a>`;
          items += `<a href="${l.onboarding.agreement_edit_url}" target="_blank" onclick="closeMenus()">${ic('edit')} Open Agreement Editor</a>`;
        }
        items += `<div class="div"></div>`;
        if (!l.dropped) items += `<a class="danger" onclick="closeMenus();leadAction('${id}','drop')">${ic('drop')} Drop Lead</a>`;
        else items += `<a onclick="closeMenus();leadAction('${id}','restore')">${ic('play')} Restore Lead</a>`;
      }
      const m = document.createElement('div');
      m.className = 'menu'; m.id = 'lead-menu'; m.innerHTML = items; m.style.display = 'block';
      document.body.appendChild(m);
      const r = ev.currentTarget.getBoundingClientRect();
      const mw = 210, mh = m.offsetHeight || 220;
      m.style.left = Math.max(8, Math.min(r.left - mw + r.width, window.innerWidth - mw - 8)) + 'px';
      m.style.top = (r.bottom + mh > window.innerHeight - 8 ? r.top - mh - 4 : r.bottom + 4) + 'px';
    }
    function closeMenus() { document.querySelectorAll('.menu').forEach(m => m.remove()); }
    document.addEventListener('click', closeMenus);
    async function leadAction(id, action) {
      const labels = {
        start_onboarding: 'Start onboarding (sends KYC form)?', cancel_onboarding: 'Cancel onboarding for this lead?',
        drop: 'Drop this lead? No further emails will be sent.', restore: 'Restore this lead?'
      };
      if (!confirm(labels[action])) return;
      try {
        const d = await api(`/lead/${id}/action`, { method: 'POST', body: JSON.stringify({ action }) });
        toast(d.message); await loadLeads(); refreshAll();
      } catch (e) { toast(e.message, false); }
    }

    <button class="ibtn" onclick="closeDrawer()">${ic('x')}</button></div>`;

      ev = (ev || '').toUpperCase();
      if (ev.includes('SIGN') || ev.includes('APPROV') || ev.includes('COMPLETE') || ev.includes('BOOK')) return '#16a34a';
      if (ev.includes('REJECT') || ev.includes('FAIL') || ev.includes('DROP') || ev.includes('INVALID')) return '#dc2626';
      if (ev.includes('SENT') || ev.includes('ADD') || ev.includes('UPDATE') || ev.includes('CREATE')) return '#2563eb';
      if (ev.includes('REPL') || ev.includes('REVIEW') || ev.includes('FOLLOW')) return '#d97706';
      return '#64748b';

    /* ============================ kanban ============================ */
    const KPAL = [['#dbe3ee', '#334155'], ['#a8cdf7', '#0b3a8c'], ['#a9e8c4', '#14532d'], ['#8fe3ab', '#14532d'],
    ['#fbdf8f', '#7c4a03'], ['#f9d06b', '#713f12'], ['#d4c7fb', '#4c1d95'], ['#bfa8f9', '#3b0b8c'],
    ['#a5dcf6', '#0c4a6e'], ['#9ef0c0', '#065f46']];
    function renderKanban() {
      // Compressed lifecycle board: each column groups one or more backend stage
      // indices, so the booking pre-stages (email sent / replied) collapse into one
      // and the KYC / NDA sent+signed pairs merge. Booking + KYC/NDA status now live
      // on the card itself rather than as separate columns.
      const COLS = [
        { label: 'New / Outreach', idx: [0, 1, 2], c: KPAL[0] },
        { label: 'Meeting Booked', idx: [3], c: KPAL[3] },
        { label: 'KYC', idx: [4, 5], c: KPAL[4] },
        { label: 'NDA', idx: [6, 7], c: KPAL[6] },
        { label: 'Agreement', idx: [8], c: KPAL[8] },
        { label: 'Completed', idx: [9], c: KPAL[9] },
      ];
      document.getElementById('view-kanban').innerHTML = `<div class="kanban">${COLS.map(col => {
        const cards = LEADS.filter(l => col.idx.includes(l.stage_index) && !l.dropped);
        const [bg, fg] = col.c;
        return `<div class="kcol">
      <div class="khead" style="background:${bg};color:${fg};">${esc(col.label)}<span class="cnt">${cards.length}</span></div>
      <div class="kbody">${cards.map(l => kcard(l, col)).join('') ||
          '<p style="font-size:11px;color:#94a3b8;text-align:center;padding:10px;">No leads</p>'}</div></div>`;
      }).join('')}</div>`;
    }
    function kcard(l, col) {
      // Column-based display: each card shows ONLY the status relevant to its column,
      // so booking no longer lingers on KYC / NDA / Agreement cards.
      const ob = l.onboarding || {};
      const when = l.selected_slot || l.booked_at;
      const cs = 'style="font-size:9.5px;"';
      let chip = '';
      switch (col.label) {
        case 'New / Outreach':
        case 'Meeting Booked':
          chip = when
            ? `<span class="chip c-green" ${cs} title="${esc(l.booked_at ? ('Booked ' + l.booked_at) : '')}">${ic('cal', 'width:11px;height:11px;')} ${esc(when)}</span>`
            : `<span class="chip c-gray" ${cs}>not booked</span>`;
          break;
        case 'KYC':
          chip = ob.kyc_status ? `<span class="chip c-blue" ${cs}>KYC ${esc(ob.kyc_status)}</span>` : `<span class="chip c-gray" ${cs}>KYC pending</span>`;
          break;
        case 'NDA':
          chip = ob.nda_signed ? `<span class="chip c-green" ${cs}>NDA ✓</span>`
            : (ob.nda_status ? `<span class="chip c-amber" ${cs}>NDA ${esc(ob.nda_status)}</span>` : `<span class="chip c-gray" ${cs}>NDA pending</span>`);
          break;
        case 'Agreement':
          chip = ob.agreement_signed ? `<span class="chip c-green" ${cs}>Agreement ✓</span>`
            : (ob.agreement_status ? `<span class="chip c-amber" ${cs}>${esc(ob.agreement_status)}</span>` : `<span class="chip c-gray" ${cs}>Agreement pending</span>`);
          break;
        default: // Completed
          chip = `<span class="chip c-green" ${cs}>${ic('check2', 'width:11px;height:11px;')} Completed</span>`;
      }
      return `<div class="kcard" onclick="openDrawer('${l.lead_id}')">
    <b>${esc(l.company)}</b><span>${esc(l.contact || '')}</span><span>${esc(l.email)}</span>
    <div class="kmeta">${chip}
      ${l.followups ? `<span class="chip c-gray" ${cs}>+${l.followups} fup</span>` : ''}</div>
    ${kcardActions(l)}</div>`;
    }
    function kcardActions(l) {
      return `<div class="kact" onclick="event.stopPropagation()">
    <button class="kebab" style="width:26px;height:26px;font-size:13px;" title="Actions"
      onclick="openLeadMenu(event,'${l.lead_id}')">⋮</button></div>`;

    /* ============================ sheet (google-sheet style) ============================ */
    let SHEET = null;
    async function loadSheet() {
      document.getElementById('view-sheet').innerHTML = '<div class="panel"><p style="color:var(--mut);">Loading sheet…</p></div>';
      try { SHEET = await api('/sheet'); } catch (e) {
        document.getElementById('view-sheet').innerHTML = `<div class="panel"><p style="color:var(--bad);">${esc(e.message)}</p></div>`; return;
      }
      renderSheet();
    }
    function renderSheet() {
      const ed = canAct();
      const cell = (v, ri) => `<td><input value="${esc(v)}" ${ed ? '' : 'readonly'} oninput="sheetDirty(${ri})"></td>`;
      let rows = SHEET.rows.map((r, ri) => {
        const full = [...r]; while (full.length < SHEET.keys.length) full.push('');
        return `<tr id="gsr-${ri}"><td class="rn">${ri + 2}</td>${full.map(v => cell(v, ri)).join('')}
      <td class="act"><button class="btn btn-g" id="gss-${ri}" style="padding:4px 10px;font-size:10.5px;display:none;"
        onclick="saveSheetRow(${ri})">${ic('save', 'width:12px;height:12px;')} Save</button></td></tr>`;
      }).join('');
      document.getElementById('view-sheet').innerHTML = `
  <div class="panel" style="padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <h3 style="margin:0;">${ic('table')} ${esc(SHEET.worksheet)} — live Google Sheet</h3>
    <span style="font-size:11.5px;color:var(--mut);">Edit a cell and press Save — it writes to the Google Sheet, the Leads database and Zoho CRM together. No duplicates (matched by email).</span>
    <span style="margin-left:auto;display:flex;gap:8px;">
      ${ed ? `<button class="btn btn-p" onclick="sheetAddRow()">${ic('plus')} Add Row</button>` : ''}
      <a class="btn btn-o" href="${SHEET.sheet_url}" target="_blank">${ic('ext')} Open in Google Sheets</a>
      <button class="btn btn-o" onclick="loadSheet()">↻</button></span></div>
  <div class="gs-wrap"><table class="gs"><thead><tr><th style="min-width:36px;width:36px;"></th>${SHEET.headers.map(h => `<th>${esc(h)}</th>`).join('')}<th style="min-width:84px;"></th></tr></thead>
    <tbody id="gs-body">${rows}</tbody></table></div>`;
    }
    function sheetDirty(ri) {
      const tr = document.getElementById('gsr-' + ri); if (!tr) return;
      tr.classList.add('dirty');
      const b = document.getElementById('gss-' + ri); if (b) b.style.display = 'inline-flex';
    }
    function sheetAddRow() {
      const body = document.getElementById('gs-body');
      const ri = body.querySelectorAll('tr').length;
      const tr = document.createElement('tr'); tr.id = 'gsr-' + ri; tr.className = 'dirty';
      tr.innerHTML = `<td class="rn">＋</td>${SHEET.keys.map(() => `<td><input oninput="sheetDirty(${ri})"></td>`).join('')}
    <td class="act"><button class="btn btn-g" id="gss-${ri}" style="padding:4px 10px;font-size:10.5px;"
      onclick="saveSheetRow(${ri})">${ic('save', 'width:12px;height:12px;')} Save</button></td>`;
      body.appendChild(tr);
      tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      tr.querySelector('input').focus();
    }
    async function saveSheetRow(ri) {
      const tr = document.getElementById('gsr-' + ri); if (!tr) return;
      const inputs = tr.querySelectorAll('input');
      const values = {}; SHEET.keys.forEach((k, i) => { if (k) values[k] = inputs[i] ? inputs[i].value : ''; });
      const btn = document.getElementById('gss-' + ri); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const d = await api('/sheet', { method: 'POST', body: JSON.stringify({ values }) });
        toast(d.message); tr.classList.remove('dirty'); btn.style.display = 'none'; btn.disabled = false;
        btn.innerHTML = 'Save'; loadLeads();
      }
      catch (e) { toast(e.message, false); btn.disabled = false; btn.innerHTML = 'Save'; }
    }

    /* ============================ bookings ============================ */
    let BOOK = null, BVIEW = 'calendar';
    async function loadBookings() {
      const now = new Date(); if (!CAL.y) { CAL.y = now.getFullYear(); CAL.m = now.getMonth() + 1; }
      try { BOOK = await api(`/bookings?year=${CAL.y}&month=${CAL.m}`); } catch (e) { return; }
      renderBookings();
    }
    function calMove(d) { CAL.m += d; if (CAL.m > 12) { CAL.m = 1; CAL.y++; } if (CAL.m < 1) { CAL.m = 12; CAL.y--; } renderBookings(); }
    function renderBookings() {
      if (!BOOK) return;
      const mn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      let h = `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div class="calhead" style="margin:0;">
      <button class="ibtn" onclick="calMove(-1)">${ic('chevL')}</button>
      <h4>${mn[CAL.m - 1]} ${CAL.y}</h4>
      <button class="ibtn" onclick="calMove(1)">${ic('chevR')}</button></div>
    <div class="seg"><button class="${BVIEW === 'calendar' ? 'on' : ''}" onclick="BVIEW='calendar';renderBookings()">Calendar</button>
      <button class="${BVIEW === 'grid' ? 'on' : ''}" onclick="BVIEW='grid';renderBookings()">Grid</button></div></div>
    <p style="font-size:11.5px;color:var(--mut);margin-top:8px;">Organizer: <b>${esc(BOOK.organizer)}</b> ·
      <span class="chip c-blue">booking</span> <span class="chip c-green">open slots</span>
      <span class="chip c-amber">holiday</span> <span class="chip c-red">blocked</span>
      ${canAct() ? ' · click the ⊘ on a day to block/unblock it' : ''}</p></div>`;
      if (BVIEW === 'calendar') {
        const first = new Date(CAL.y, CAL.m - 1, 1), start = (first.getDay() + 6) % 7, dim = new Date(CAL.y, CAL.m, 0).getDate();
        const today = new Date().toISOString().slice(0, 10);
        h += `<div class="panel"><div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('')}`;
        for (let i = 0; i < start; i++)h += `<div class="day out"></div>`;
        for (let d = 1; d <= dim; d++) {

        ${bks.map(b => `<span class="bk" title="${esc(b.company)} — ${esc(b.slot || b.time)}" onclick="openDrawer('${b.lead_id}')">${b.time} ${esc(b.company)}</span>`).join('')}

    /* ============================ documents ============================ */
    function docStageChip(stage) {
      const map = {
        nda_sent: ['c-blue', 'Sent for Review'],
        agr_sent: ['c-blue', 'Sent for Review'],
        nda_modify: ['c-amber', 'Changes Requested'],
        agr_modify: ['c-amber', 'Changes Requested'],
        lead_accept: ['c-blue', 'Terms Accepted'],
        sign_sent: ['c-purple', 'Awaiting Signature'],
        signed: ['c-green', '&#10003; Signed'],
      };
      if (!stage) return '';
      const [cls, label] = map[stage] || ['c-gray', stage];
      return `<span class="chip ${cls}">${label}</span>`;
    }
    function docCell(o, k) {
      const stage = o[k + '_stage'];
      let h = stage ? docStageChip(stage) : chip(o[k + '_status']);
      h += `<br><a class="btn ${canAct() ? 'btn-p' : 'btn-o'}" style="padding:5px 11px;font-size:11px;margin-top:5px;" target="_blank" href="${o[k + '_edit_url']}">${ic(canAct() ? 'edit' : 'eye')} ${canAct() ? 'Edit & Preview' : 'Preview'}</a>
    <button class="btn btn-o" style="padding:5px 11px;font-size:11px;margin-top:5px;" onclick="navigator.clipboard.writeText('${o[k + '_sign_url']}');toast('Signing link copied')">${ic('copy')} Sign Link</button>`;
      return h;
    }
    function docPipeline(o) {
      const kycDone = ['APPROVED', 'PROCEED_NEXT'].includes(o.kyc_status);
      const ndaSent = !!o.nda_stage;
      const ndaSign = o.nda_stage === 'signed';
      const agrSent = !!o.agreement_stage;
      const agrSign = o.agreement_stage === 'signed';
      const dot = (done, tip) => `<div class="dp-dot${done ? ' done' : ''}" title="${tip}"></div>`;
      const line = done => `<div class="dp-line${done ? ' done' : ''}"></div>`;
      return `<div class="doc-pipeline" title="KYC → NDA → NDA Signed → Agreement → Agreement Signed">
        ${dot(kycDone, 'KYC')}${line(ndaSent)}${dot(ndaSent, 'NDA Sent')}${line(ndaSign)}${dot(ndaSign, 'NDA Signed')}${line(agrSent)}${dot(agrSent, 'Agreement Sent')}${line(agrSign)}${dot(agrSign, 'Agreement Signed')}
      </div>`;
    }
    function renderDocs() {
      const rows = LEADS.filter(l => l.onboarding);

        document.getElementById('view-docs').innerHTML = '<div class="panel" style="text-align:center;color:var(--mut);padding:48px;">No onboarding records yet</div>';

      const cards = rows.map(l => {

        return `<div class="doc-card">

  <div id="va-cap" class="va-cap"></div>
  <div id="va-pop" class="va-pop"></div>
  <button id="va-gear" class="va-gear" title="Voice settings" onclick="vaSettings()">&#9881;</button>
  <button id="va-btn" class="va-btn" title="Click and speak" onclick="vaToggle()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
      <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
      <line x1="12" y1="19" x2="12" y2="23" />
    </svg>
  </button>
  <script>
    let VA_REC = null, VA_BUSY = false, VA_HIST = [],
      VA_MUTE = (localStorage.getItem('va_mute') === '1'),
      VA_VOICE = localStorage.getItem('va_voice') || '';
    const VA_SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    function vaState(s) {
      const b = document.getElementById('va-btn'); if (!b) return;
      b.classList.remove('listening', 'thinking', 'speaking'); if (s) b.classList.add(s);
    }
    function vaCap(html, hold) {
      const c = document.getElementById('va-cap'); if (!c) return;
      c.innerHTML = html; c.classList.add('show'); clearTimeout(c._t);
      if (hold !== false) c._t = setTimeout(() => c.classList.remove('show'), 5500);
    }

    function vaToggle() {
      if (VA_BUSY) { return; }
      if (!VA_SR) { const t = prompt('Ask the assistant:'); if (t) vaSend(t); return; }
      try {
        VA_REC = new VA_SR(); VA_REC.lang = 'en-US'; VA_REC.interimResults = false; VA_REC.maxAlternatives = 1;
        vaState('listening'); vaCap('Listening…', false);
        VA_REC.onresult = e => vaSend(e.results[0][0].transcript);
        VA_REC.onerror = () => { vaState(''); vaCap('Didn’t catch that — tap and try again.'); };
        VA_REC.onend = () => { if (!VA_BUSY) vaState(''); };
        VA_REC.start();
      } catch (err) { vaState(''); vaCap('Voice unavailable in this browser.'); }
    }

    async function vaSend(text) {
      VA_BUSY = true; vaState('thinking'); vaCap('<b>You:</b> ' + esc(text), false);
      try {
        const view = (document.querySelector('.nav a.active') || { dataset: {} }).dataset.view || '';
        const d = await api('/assistant', {
          method: 'POST', body: JSON.stringify({
            message: text, history: VA_HIST.slice(-8), context: { view: view }
          })
        });
        const reply = d.reply || '';
        VA_HIST.push({ role: 'user', content: text }); VA_HIST.push({ role: 'assistant', content: reply });
        if (d.directive) vaExec(d.directive);
        vaCap('<b>You:</b> ' + esc(text) + '<br><b>Jane:</b> ' + esc(vaClean(reply)));
        vaSpeak(reply);
      } catch (e) { vaCap('<b>Error:</b> ' + esc(e.message)); vaState(''); VA_BUSY = false; }
    }

    function vaExec(d) {
      try {
        switch (d.type) {
          case 'navigate': if (d.view) nav(d.view); break;
          case 'open_lead': if (d.lead_id) openDrawer(d.lead_id); break;
          case 'open_comments': openComments(); break;
          case 'open_notifications': toggleNotifications(); break;
          case 'filter_board': nav('kanban'); break;
        }
      } catch (e) { }
    }

    // Strip markdown / special characters so the voice never reads "asterisk asterisk" etc.
    function vaClean(t) {
      return (t || '')
        .replace(/```[\s\S]*?```/g, ' ')       // code blocks
        .replace(/`([^`]+)`/g, '$1')           // inline code
        .replace(/\*\*([^*]+)\*\*/g, '$1')     // **bold**
        .replace(/\*([^*]+)\*/g, '$1')         // *italic*
        .replace(/__([^_]+)__/g, '$1')
        .replace(/_([^_]+)_/g, '$1')
        .replace(/^\s*#{1,6}\s+/gm, '')        // # headings
        .replace(/^\s*[-*•]\s+/gm, '')         // bullet markers
        .replace(/[*_`~#>|^=]+/g, ' ')         // any stray markdown chars
        .replace(/\s+/g, ' ').trim();
    }
    function vaSpeak(text) {
      text = vaClean(text);
      if (VA_MUTE || !text || !window.speechSynthesis) { vaState(''); VA_BUSY = false; return; }
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const v = (speechSynthesis.getVoices() || []).find(x => x.name === VA_VOICE);
        if (v) u.voice = v;
        u.onend = () => { vaState(''); VA_BUSY = false; };
        u.onerror = () => { vaState(''); VA_BUSY = false; };
        vaState('speaking'); speechSynthesis.speak(u);
      } catch (e) { vaState(''); VA_BUSY = false; }
    }

    function vaSettings() {
      const p = document.getElementById('va-pop'); if (!p) return;
      if (p.style.display === 'block') { p.style.display = 'none'; return; }
      const voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
      p.innerHTML = `<div style="font-weight:700;font-size:12.5px;margin-bottom:9px;">${ic('mail')} Voice settings</div>
    <label style="font-size:11px;color:var(--mut);">Voice (${voices.length} available)</label>
    <select id="va-voice-sel" style="width:100%;margin:4px 0 11px;padding:7px;border:1px solid var(--bd);border-radius:7px;font-size:12px;">
      <option value="">System default</option>
      ${voices.map(v => `<option value="${esc(v.name)}" ${v.name === VA_VOICE ? 'selected' : ''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}
    </select>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;">
      <input type="checkbox" id="va-mute" ${VA_MUTE ? 'checked' : ''}> Mute spoken replies</label>
    <button class="btn btn-o" style="margin-top:11px;width:100%;padding:7px;font-size:12px;" onclick="vaTest()">\u{1F50A} Test voice</button>`;
      p.style.display = 'block';
      document.getElementById('va-voice-sel').onchange = e => { VA_VOICE = e.target.value; localStorage.setItem('va_voice', VA_VOICE); };
      document.getElementById('va-mute').onchange = e => { VA_MUTE = e.target.checked; localStorage.setItem('va_mute', VA_MUTE ? '1' : '0'); };
    }
    function vaTest() { const m = VA_MUTE; VA_MUTE = false; vaSpeak('Hello ' + (NAME || 'there') + ', this is your Jane Aerospace co-pilot.'); VA_MUTE = m; }

    function vaWelcome() {
      if (!TOKEN || sessionStorage.getItem('va_welcomed')) return;
      sessionStorage.setItem('va_welcomed', '1');
      const msg = 'Welcome back, ' + (NAME || 'there') + '.';
      setTimeout(() => { vaCap('<b>Jane:</b> ' + esc(msg)); vaSpeak(msg); }, 1000);
    }
    // prime the voice list (loads async in Chrome) and greet after login
    if (window.speechSynthesis) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { }; } catch (e) { } }
    (function () {
      const _enter = window.enterApp;
      if (typeof _enter === 'function') { window.enterApp = function () { _enter.apply(this, arguments); vaWelcome(); }; }
      if (TOKEN) vaWelcome();
    })();
  </script>
</body>

</html>
