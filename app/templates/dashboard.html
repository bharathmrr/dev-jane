<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jane Aerospace — Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#050F1F;--navy2:#0A1F3D;
  --blue:#1a56db;--blue2:#2563EB;--blue-lt:#3b82f6;--blue-pale:#EFF6FF;
  --teal:#0891b2;--teal-pale:#ECFEFF;
  --green:#059669;--green2:#10B981;--green-pale:#ECFDF5;
  --amber:#d97706;--amber-pale:#FFFBEB;
  --red:#dc2626;--red-pale:#FEF2F2;
  --violet:#7c3aed;--violet-pale:#F5F3FF;
  --bg:#EEF2F7;--surface:#FFFFFF;--surface2:#F8FAFC;
  --border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#334155;--text3:#64748B;--text4:#94A3B8;
  --sidebar-w:66px;--header-h:62px;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);
  --sh-sm:0 2px 6px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 6px 18px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.06);
  --sh-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.08);
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;
  --font:'Inter',system-ui,sans-serif;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#080F1D;--surface:#101827;--surface2:#162032;
  --border:#1E2D45;--border2:#263550;
  --text:#E8F1FF;--text2:#A8BDD8;--text3:#6B85A8;--text4:#3D5270;
  --blue-pale:rgba(26,86,219,.15);--green-pale:rgba(5,150,105,.12);
  --red-pale:rgba(220,38,38,.12);--amber-pale:rgba(217,119,6,.12);--violet-pale:rgba(124,58,237,.12);
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
#root{height:100%;display:flex}
.shell{display:flex;width:100%;height:100%;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:relative;z-index:200;border-right:1px solid rgba(255,255,255,.04);transition:width .28s cubic-bezier(.4,0,.2,1);overflow:hidden}
.sidebar:hover{width:220px}
.sb-logo{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;overflow:hidden}
.sb-logomark{width:36px;height:36px;flex-shrink:0;border-radius:10px;background:linear-gradient(135deg,#1a56db,#0891b2);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(26,86,219,.4)}
.sb-brand{overflow:hidden;white-space:nowrap}
.sb-brand-name{color:#fff;font-size:13px;font-weight:800;letter-spacing:-.2px}
.sb-brand-tag{color:rgba(255,255,255,.32);font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.4);font-size:13px;font-weight:500;transition:var(--transition);white-space:nowrap;overflow:hidden}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.sb-item.on{background:rgba(26,86,219,.22);color:#60a5fa;border-left:2px solid #60a5fa;padding-left:6px}
.sb-icon{font-size:17px;flex-shrink:0;width:20px;text-align:center}
.sb-item-badge{margin-left:auto;background:#dc2626;color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0}
.sb-footer{padding:8px;border-top:1px solid rgba(255,255,255,.05);margin-top:auto;overflow:hidden}

/* Body */
.body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Header */
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:var(--sh-xs);transition:background var(--transition)}
.hdr-title{flex:1}
.hdr-title h1{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1}
.hdr-title p{font-size:11px;color:var(--text4);font-weight:500;margin-top:1px}
.hdr-sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green2);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.live-text{font-size:11px;font-weight:600;color:var(--green);white-space:nowrap}
.hdr-time{font-size:11px;color:var(--text3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.hdr-countdown{font-size:10px;color:var(--text4);font-weight:500;white-space:nowrap}
.hdr-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);font-family:var(--font);transition:var(--transition);flex-shrink:0}
.hdr-btn:hover{background:var(--border);color:var(--text)}
.hdr-btn.spin svg{animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert-bell{position:relative}
.alert-bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:8px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid var(--surface)}
.dm-btn{width:32px;height:32px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:var(--transition);flex-shrink:0}
.dm-btn:hover{background:var(--border)}

/* Quick Bar */
.quick-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;transition:background var(--transition)}
.qb-search{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;flex:1;max-width:340px;transition:var(--transition)}
.qb-search:focus-within{border-color:var(--blue-lt);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.qb-search input{border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:var(--font)}
.qb-search input::placeholder{color:var(--text4)}
.qb-btn{display:flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface);font-family:var(--font);transition:var(--transition);flex-shrink:0}
.qb-btn:hover{background:var(--surface2);color:var(--text)}
.qb-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.qb-btn.primary:hover{background:var(--blue2)}
.qb-spacer{flex:1}

/* Content */
.content{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;cursor:default;transition:box-shadow .2s,transform .2s,background var(--transition)}
.kpi-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--blue));border-radius:14px 14px 0 0}
.kpi-card-inner{display:flex;align-items:flex-start;gap:10px}
.kpi-icon-wrap{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--ki-bg,var(--blue-pale))}
.kpi-body{flex:1;min-width:0}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;color:var(--text4);margin-bottom:4px}
.kpi-val{font-size:28px;font-weight:900;color:var(--text);line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:var(--text3)}
.trend-up{background:var(--green-pale);color:var(--green);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700}
.trend-dn{background:var(--red-pale);color:var(--red);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700}
.trend-eq{background:var(--surface2);color:var(--text4);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.kpi-ring-wrap{margin-top:10px;display:flex;justify-content:center}
.kpi-prog{margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.kpi-prog-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.kpi-card::after{content:attr(data-icon);position:absolute;bottom:-6px;right:-2px;font-size:52px;opacity:.05;pointer-events:none;line-height:1}

/* Alert */
.alert{border-radius:12px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px;background:linear-gradient(135deg,var(--amber-pale),#FEF3C7);border:1px solid #FDE68A}
.alert.crit{background:linear-gradient(135deg,var(--red-pale),#FFE4E6);border-color:#FECDD3}
.alert-left{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.alert-icon{font-size:22px;line-height:1}
.alert-dismiss{background:none;border:none;cursor:pointer;color:var(--text4);font-size:16px;padding:0;line-height:1;transition:var(--transition)}
.alert-dismiss:hover{color:var(--text)}
.alert-body{flex:1}
.alert-title{font-size:13px;font-weight:700;color:#92400E;margin-bottom:6px}
.alert.crit .alert-title{color:#9F1239}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent;cursor:default}
.cw{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.ci{background:#DBEAFE;color:#1D4ED8;border-color:#BFDBFE}
.cg{background:#D1FAE5;color:#065F46;border-color:#A7F3D0}
.cp{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE}
.stuck-expand-btn{background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;color:#92400E;margin-top:6px;padding:0;text-decoration:underline;text-underline-offset:2px;font-family:var(--font)}
.alert.crit .stuck-expand-btn{color:#9F1239}
.stuck-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.stuck-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.5);border-radius:6px;padding:6px 10px;font-size:11px;border:1px solid rgba(0,0,0,.06)}
.stuck-co{font-weight:700;color:var(--text)}
.stuck-age{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}

/* Grid */
.three-col{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1000px){.three-col{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}
@media(max-width:680px){.three-col,.two-col{grid-template-columns:1fr}}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-sm);overflow:hidden;transition:background var(--transition)}
.ph{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ph-title{font-size:13px;font-weight:700;color:var(--text);flex:1;display:flex;align-items:center;gap:7px}
.ph-badge{background:var(--blue-pale);color:var(--blue);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.ph-badge.green{background:var(--green-pale);color:var(--green)}
.ph-badge.amber{background:var(--amber-pale);color:var(--amber)}
.ph-badge.red{background:var(--red-pale);color:var(--red)}
.pb{padding:15px 16px}

/* Funnel */
.f-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.f-lbl{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.4px;width:60px;flex-shrink:0}
.f-track{flex:1;background:var(--surface2);border-radius:5px;height:26px;overflow:hidden}
.f-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.f-fill span{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.f-n{font-size:12px;font-weight:800;color:var(--text);width:44px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.f-drop{font-size:10px;width:36px;text-align:right;flex-shrink:0;font-weight:700}

/* Activity */
.activity-feed{display:flex;flex-direction:column;gap:0}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px}
.activity-dot.complete{background:var(--green-pale);border:1px solid #A7F3D0}
.activity-body{flex:1}
.activity-co{font-size:12px;font-weight:700;color:var(--text)}
.activity-sub{font-size:11px;color:var(--text3);margin-top:1px}
.activity-time{font-size:10px;color:var(--text4);flex-shrink:0;margin-top:3px}

/* Table */
.tbl-wrap{overflow-x:auto;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 12px;text-align:left;background:var(--surface2);font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.55px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;transition:var(--transition)}
th:hover{color:var(--text2)}
th.sorted .sort-icon{opacity:1;color:var(--blue)}
th .sort-icon{margin-left:3px;opacity:.5}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background var(--transition)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.co{font-weight:700;color:var(--text)}
.co-sub{font-size:10px;color:var(--text4);margin-top:1px}
.co-em{font-size:10px;color:var(--blue);margin-top:1px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.bd{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.bpend{background:#FEF9C3;color:#A16207;border-color:#FDE68A}.bpend .bd{background:#A16207}
.brev{background:#DBEAFE;color:#1D4ED8;border-color:#BFDBFE}.brev .bd{background:#1D4ED8}
.bappr{background:#D1FAE5;color:#065F46;border-color:#A7F3D0}.bappr .bd{background:#059669}
.brej{background:#FEE2E2;color:#991B1B;border-color:#FECACA}.brej .bd{background:#dc2626}
.bsent{background:#E0F2FE;color:#0369A1;border-color:#BAE6FD}.bsent .bd{background:#0284C7}
.bsign{background:#F0FDF4;color:#166534;border-color:#86EFAC}.bsign .bd{background:#16A34A}
.bdraft{background:var(--surface2);color:var(--text3);border-color:var(--border)}.bdraft .bd{background:var(--text4)}
.bcomp{background:#D1FAE5;color:#065F46;border-color:#6EE7B7;font-weight:800}.bcomp .bd{background:var(--green)}
.bna{background:var(--surface2);color:var(--text4);font-style:italic}.bna .bd{background:var(--border2)}

/* Score */
.srow{display:flex;align-items:center;gap:5px}
.sbg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:50px}
.sfill{height:100%;border-radius:3px;transition:width .6s ease}
.sn{font-size:10px;font-weight:800;color:var(--text3);width:24px;text-align:right;flex-shrink:0}

/* Actions */
.act{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border:1px solid transparent;border-radius:6px;cursor:pointer;font-size:10px;font-weight:700;font-family:var(--font);transition:var(--transition);white-space:nowrap}
.act:disabled{opacity:.5;cursor:not-allowed}
.a-ok{background:#D1FAE5;color:#065F46;border-color:#A7F3D0}.a-ok:not(:disabled):hover{background:#A7F3D0}
.a-no{background:#FEE2E2;color:#991B1B;border-color:#FECACA}.a-no:not(:disabled):hover{background:#FECACA}

/* Toolbar */
.toolbar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);transition:background var(--transition)}
.seg{display:flex;background:var(--surface2);border-radius:7px;padding:3px;border:1px solid var(--border)}
.seg-btn{padding:5px 12px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:500;color:var(--text3);background:none;font-family:var(--font);transition:var(--transition);white-space:nowrap}
.seg-btn.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--sh-xs)}
.seg-btn.hot{color:var(--red)}
.tbl-search{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;flex:1;max-width:260px}
.tbl-search input{border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:var(--font)}
.tbl-search input::placeholder{color:var(--text4)}
.tbl-count{font-size:11px;color:var(--text4);margin-left:auto;white-space:nowrap}

/* Pagination */
.pagination{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.pg-btn{padding:4px 10px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text3);background:var(--surface);font-family:var(--font);transition:var(--transition)}
.pg-btn:hover:not(:disabled){background:var(--surface2)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg-info{font-size:11px;color:var(--text4);margin-left:auto}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:16px;padding:24px;max-width:380px;width:90%;box-shadow:var(--sh-lg);border:1px solid var(--border)}
.modal h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--font);transition:var(--transition)}
.modal-btn.cancel{background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
.modal-btn.cancel:hover{background:var(--border)}
.modal-btn.confirm-ok{background:var(--green);color:#fff}
.modal-btn.confirm-ok:hover{background:#047857}
.modal-btn.confirm-no{background:var(--red);color:#fff}
.modal-btn.confirm-no:hover{background:#b91c1c}

/* Conversion bars */
.cv-row{margin-bottom:12px}
.cv-hdr{display:flex;justify-content:space-between;margin-bottom:4px}
.cv-lbl{font-size:12px;color:var(--text2);font-weight:500}
.cv-pct{font-size:12px;font-weight:800}
.cv-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.cv-fill{height:100%;border-radius:4px;transition:width .8s ease}

/* OB breakdown */
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ob-cell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center}
.ob-cell-v{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ob-cell-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text4);margin-top:3px}

/* Skeleton / empty */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:400%;animation:shim 1.4s ease infinite;border-radius:10px}
@keyframes shim{0%{background-position:100%}100%{background-position:0}}
.sk-kpi{height:115px}
.sk-row{height:44px;margin-bottom:8px;border-radius:6px}
.sk-panel{height:200px}
.empty{text-align:center;padding:40px 20px;color:var(--text4)}
.empty-icon{font-size:36px;margin-bottom:10px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:var(--sh-lg);z-index:2000;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:300px}
.toast.on{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
@media print{.sidebar,.quick-bar,.hdr-btn,.dm-btn,.toolbar,.pagination,.act{display:none!important}.content{padding:0}.panel{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo}=React;
const BASE='/api/v1';

const KPI_COLORS={blue:'#1a56db',teal:'#0891b2',green:'#059669',amber:'#d97706',red:'#dc2626',violet:'#7c3aed'};
const KPI_BG={blue:'#EFF6FF',teal:'#ECFEFF',green:'#ECFDF5',amber:'#FFFBEB',red:'#FEF2F2',violet:'#F5F3FF'};
const VARIANT_COLORS={A:'#1a56db',B:'#059669',C:'#d97706',S1:'#7c3aed',S2:'#0891b2',S3:'#dc2626'};

const fmtN=n=>n==null?'—':Number(n).toLocaleString('en-IN');
const fmtP=n=>n==null?'—':(+n).toFixed(1)+'%';
const daysAgo=iso=>{if(!iso)return null;return Math.floor((Date.now()-new Date(iso))/864e5)};
const scoreClr=n=>n>=8?'#059669':n>=5?'#d97706':'#dc2626';
function badgeCls(v){
  if(!v||v==='N/A'||v==='not_started')return 'bna';
  const s=v.toLowerCase();
  if(s.includes('pend'))return 'bpend';if(s.includes('review'))return 'brev';
  if(s.includes('approv'))return 'bappr';if(s.includes('reject'))return 'brej';
  if(s.includes('draft'))return 'bdraft';if(s.includes('sent'))return 'bsent';
  if(s.includes('sign'))return 'bsign';if(s.includes('complet')||s==='done')return 'bcomp';
  return 'bdraft';
}
const dispSt=v=>{if(!v||v==='N/A')return 'N/A';return v.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())};
const hexToRgba=(hex,a)=>{const r=parseInt(hex.slice(1,3),16);const g=parseInt(hex.slice(3,5),16);const b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`};

function useAnimCounter(value,duration=750){
  const [disp,setDisp]=useState(0);
  const raf=useRef(null);
  useEffect(()=>{
    const end=typeof value==='number'?value:parseFloat(value)||0;
    const start=performance.now();
    const step=now=>{
      const p=Math.min((now-start)/duration,1);
      const e=1-Math.pow(1-p,3);
      setDisp(Math.round(end*e));
      if(p<1)raf.current=requestAnimationFrame(step);
    };
    raf.current=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf.current);
  },[value,duration]);
  return disp;
}

function Ring({pct,color,size=44}){
  const r=size/2-4;const circ=2*Math.PI*r;
  const [offset,setOffset]=useState(circ);
  useEffect(()=>{const t=setTimeout(()=>setOffset(circ*(1-Math.min(pct||0,100)/100)),50);return()=>clearTimeout(t)},[pct,circ]);
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth="3.5"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="3.5"
      strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
      style={{transition:'stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)',transformOrigin:'center',transform:'rotate(-90deg)'}}/>
    <text x={size/2} y={size/2+3.5} textAnchor="middle" fontSize="10" fontWeight="800" fill={color}
      style={{fontFamily:'Inter,sans-serif'}}>{Math.round(pct||0)}%</text>
  </svg>;
}

function useToast(){
  const [state,setState]=useState({msg:'',type:'',on:false});const t=useRef(null);
  const fire=useCallback((msg,type='default')=>{setState({msg,type,on:true});clearTimeout(t.current);t.current=setTimeout(()=>setState(s=>({...s,on:false})),2800)},[]);
  return {...state,fire};
}

function useCountdown(from=30){
  const [sec,setSec]=useState(from);
  useEffect(()=>{setSec(from);const i=setInterval(()=>setSec(s=>s<=1?from:s-1),1000);return()=>clearInterval(i)},[from]);
  return sec;
}

function useData(){
  const [stats,setStats]=useState(null);
  const [summary,setSummary]=useState(null);
  const [onboarding,setOB]=useState([]);
  const [abStats,setAB]=useState(null);
  const [loading,setLoading]=useState(true);
  const [lastRefresh,setLR]=useState(null);
  const load=useCallback(async()=>{
    setLoading(true);
    const safe=p=>p.then(r=>r.ok?r.json():null).catch(()=>null);
    const [s,sm,ob,ab]=await Promise.all([
      safe(fetch(`${BASE}/v2/dashboard/stats`)),
      safe(fetch(`${BASE}/onboarding/pipeline-summary.json`)),
      safe(fetch(`${BASE}/onboarding/list`)),
      safe(fetch(`${BASE}/v2/ab-stats`)),
    ]);
    if(s)setStats(s);if(sm)setSummary(sm);
    if(ob)setOB(Array.isArray(ob)?ob:ob?.items||ob?.data||[]);
    if(ab)setAB(ab);
    setLoading(false);setLR(new Date());
  },[]);
  useEffect(()=>{load();const iv=setInterval(load,30000);return()=>clearInterval(iv)},[load]);
  return {stats,summary,onboarding,abStats,loading,refresh:load,lastRefresh};
}

function Clock(){
  const [t,setT]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
  return <span className="hdr-time">
    {t.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})} ·{' '}
    {t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})} IST
  </span>;
}

function DoughnutChart({stats}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!stats||!ref.current)return;
    if(inst.current)inst.current.destroy();
    const t=stats.total_leads||0;const s=stats.sent_leads||0;
    const rp=stats.replied_leads||0;const bk=stats.booked_leads||0;
    inst.current=new window.Chart(ref.current.getContext('2d'),{
      type:'doughnut',
      data:{
        labels:['Not Yet Sent','Sent · No Reply','Replied · Not Booked','Booked ✓'],
        datasets:[{
          data:[Math.max(0,t-s),Math.max(0,s-rp),Math.max(0,rp-bk),bk],
          backgroundColor:['#E2E8F0','#BAE6FD','#FDE68A','#6EE7B7'],
          borderColor:['#CBD5E1','#7DD3FC','#FCD34D','#34D399'],
          borderWidth:1.5,hoverOffset:6
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'70%',
        plugins:{
          legend:{position:'bottom',labels:{font:{family:'Inter',size:10,weight:'600'},padding:10,boxWidth:9,usePointStyle:true,color:document.documentElement.dataset.theme==='dark'?'#A8BDD8':'#64748B'}},
          tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw?.toLocaleString('en-IN')}`},bodyFont:{family:'Inter'},titleFont:{family:'Inter'}}
        }
      }
    });
    return()=>{if(inst.current)inst.current.destroy()};
  },[stats]);
  if(!stats)return <div className="empty"><div className="empty-icon">📊</div><p>No data</p></div>;
  return <div style={{height:215,position:'relative'}}><canvas ref={ref}/></div>;
}

function ABBarChart({abStats}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!abStats||!ref.current)return;
    const variants=abStats.variants||abStats||{};
    const keys=Object.keys(variants).filter(k=>variants[k]);
    if(!keys.length)return;
    if(inst.current)inst.current.destroy();
    const isDark=document.documentElement.dataset.theme==='dark';
    inst.current=new window.Chart(ref.current.getContext('2d'),{
      type:'bar',
      data:{
        labels:keys,
        datasets:[
          {label:'Sent',data:keys.map(k=>variants[k]?.sent||0),backgroundColor:keys.map(k=>hexToRgba(VARIANT_COLORS[k]||'#94A3B8',.25)),borderColor:keys.map(k=>VARIANT_COLORS[k]||'#94A3B8'),borderWidth:2,borderRadius:5,borderSkipped:false},
          {label:'Replied',data:keys.map(k=>variants[k]?.replied||0),backgroundColor:keys.map(k=>VARIANT_COLORS[k]||'#94A3B8'),borderColor:keys.map(k=>VARIANT_COLORS[k]||'#94A3B8'),borderWidth:2,borderRadius:5,borderSkipped:false},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{position:'top',labels:{font:{family:'Inter',size:10,weight:'600'},boxWidth:9,usePointStyle:true,padding:10,color:isDark?'#A8BDD8':'#64748B'}},
          tooltip:{bodyFont:{family:'Inter'},titleFont:{family:'Inter'}}
        },
        scales:{
          y:{beginAtZero:true,grid:{color:isDark?'#1E2D45':'#F1F5F9'},ticks:{font:{family:'Inter',size:10},color:isDark?'#6B85A8':'#64748B'}},
          x:{grid:{display:false},ticks:{font:{family:'Inter',size:11,weight:'700'},color:isDark?'#A8BDD8':'#334155'}}
        }
      }
    });
    return()=>{if(inst.current)inst.current.destroy()};
  },[abStats]);
  if(!abStats)return <div className="empty"><div className="empty-icon">🧪</div><p>No A/B data</p></div>;
  return <div style={{height:195,position:'relative'}}><canvas ref={ref}/></div>;
}

function Header({loading,lastRefresh,onRefresh,alertCount,darkMode,toggleDark}){
  const cd=useCountdown(30);
  return <header className="header">
    <div className="hdr-title">
      <h1>Pipeline Command Centre</h1>
      <p>Jane Aerospace · MIS Dashboard</p>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:4}}>
      <div className="live-dot"/>
      <span className="live-text">{loading?'Refreshing…':'Live'}</span>
    </div>
    <Clock/>
    {lastRefresh&&!loading&&<span className="hdr-countdown">↻ Next in {cd}s</span>}
    <div className="hdr-sep"/>
    {alertCount>0&&<span className="alert-bell">
      <button className="hdr-btn" title="Alerts">🔔
        <span className="alert-bell-badge">{alertCount}</span>
      </button>
    </span>}
    <div className="dm-btn" onClick={toggleDark} title={darkMode?'Light mode':'Dark mode'}>{darkMode?'☀️':'🌙'}</div>
    <button className={`hdr-btn${loading?' spin':''}`} onClick={onRefresh} title="Refresh (R)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
        <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      Refresh
    </button>
  </header>;
}

function Sidebar({active,setActive,onboarding}){
  const actionCount=onboarding.filter(r=>r.pending_action).length;
  const nav=[
    {id:'pipeline',icon:'📊',label:'Pipeline'},
    {id:'onboarding',icon:'🏢',label:'Onboarding',badge:actionCount||null},
    {id:'analytics',icon:'📈',label:'Analytics'},
  ];
  return <aside className="sidebar">
    <div className="sb-logo">
      <div className="sb-logomark">✈</div>
      <div className="sb-brand">
        <div className="sb-brand-name">Jane Aerospace</div>
        <div className="sb-brand-tag">Command Centre</div>
      </div>
    </div>
    <nav className="sb-nav">
      {nav.map(n=>(
        <div key={n.id} className={`sb-item${active===n.id?' on':''}`} onClick={()=>setActive(n.id)}>
          <span className="sb-icon">{n.icon}</span>
          <span>{n.label}</span>
          {n.badge?<span className="sb-item-badge">{n.badge}</span>:null}
        </div>
      ))}
    </nav>
    <div className="sb-footer">
      <div className="sb-item" onClick={()=>window.open(`${BASE}/onboarding/pipeline-summary.json`,'_blank')}>
        <span className="sb-icon">⚙</span><span>API Status</span>
      </div>
    </div>
  </aside>;
}

function QuickBar({globalSearch,setGlobalSearch,onSync,onExport,loading}){
  return <div className="quick-bar">
    <div className="qb-search">
      <span style={{fontSize:13,color:'var(--text4)'}}>🔍</span>
      <input placeholder="Global search — company, email, contact…"
        value={globalSearch} onChange={e=>setGlobalSearch(e.target.value)}/>
      {globalSearch&&<span style={{cursor:'pointer',color:'var(--text4)',fontSize:14}} onClick={()=>setGlobalSearch('')}>✕</span>}
    </div>
    <div className="qb-spacer"/>
    <button className="qb-btn" onClick={onSync} disabled={loading}>📊 Sync Sheets</button>
    <button className="qb-btn" onClick={onExport}>⬇ Export CSV</button>
    <button className="qb-btn primary" onClick={()=>window.print()}>🖨 Print</button>
  </div>;
}

function KPICard({icon,label,value,rawValue,foot,pctVal,color,loading,showRing}){
  const animated=useAnimCounter(typeof rawValue==='number'?rawValue:0);
  if(loading)return <div className="kpi-card sk sk-kpi"/>;
  const clr=KPI_COLORS[color]||KPI_COLORS.blue;
  const bg=KPI_BG[color]||KPI_BG.blue;
  const displayVal=typeof rawValue==='number'?animated.toLocaleString('en-IN'):value;
  const trendDir=pctVal>60?'up':pctVal<20?'dn':'eq';
  return <div className="kpi-card" data-icon={icon} style={{'--kc':clr}}>
    <div className="kpi-card-inner">
      <div className="kpi-icon-wrap" style={{background:bg}}>{icon}</div>
      <div className="kpi-body">
        <div className="kpi-lbl">{label}</div>
        <div className="kpi-val">{displayVal}</div>
      </div>
    </div>
    <div className="kpi-foot">
      <span>{foot}</span>
      {pctVal!=null&&<span className={`trend-${trendDir}`}>{trendDir==='up'?'▲':trendDir==='dn'?'▼':'●'} {Math.round(pctVal)}%</span>}
    </div>
    {showRing&&pctVal!=null&&<div className="kpi-ring-wrap"><Ring pct={pctVal} color={clr}/></div>}
    {pctVal!=null&&!showRing&&<div className="kpi-prog"><div className="kpi-prog-fill" style={{width:Math.min(pctVal,100)+'%',background:clr}}/></div>}
  </div>;
}

function KPIGrid({stats,summary,loading}){
  const s=stats||{};const c=(summary||{}).counts||{};
  const total=s.total_leads||0;const sent=s.sent_leads||0;
  const replied=s.replied_leads||0;const booked=s.booked_leads||0;
  const obTotal=summary?.total||0;const complete=c.complete||0;
  const sentPct=total?Math.round(sent/total*100):0;
  const replyPct=sent?Math.round(replied/sent*100):0;
  const bookPct=replied?Math.round(booked/replied*100):0;
  const obPct=booked?Math.round(obTotal/booked*100):0;
  const compPct=obTotal?Math.round(complete/obTotal*100):0;
  const cards=[
    {icon:'👥',label:'Total Leads',value:fmtN(total),rawValue:total,foot:'In pipeline',color:'blue'},
    {icon:'📤',label:'Emails Sent',value:fmtN(sent),rawValue:sent,foot:'of total leads',pctVal:sentPct,color:'teal'},
    {icon:'💬',label:'Replied',value:fmtN(replied),rawValue:replied,foot:'reply rate',pctVal:replyPct,color:'amber'},
    {icon:'📅',label:'Booked',value:fmtN(booked),rawValue:booked,foot:'of replied',pctVal:bookPct,color:'green'},
    {icon:'🎯',label:'Conversion',value:fmtP(s.conversion_rate),rawValue:null,foot:'Leads → Booked',pctVal:+(s.conversion_rate||0),color:'violet',showRing:true},
    {icon:'🏢',label:'Onboarding',value:fmtN(obTotal),rawValue:obTotal,foot:'started',pctVal:obPct,color:'blue'},
    {icon:'✅',label:'Complete',value:fmtN(complete),rawValue:complete,foot:'Fully onboarded',pctVal:compPct,color:'green',showRing:true},
  ];
  return <div className="kpi-grid">{cards.map((c,i)=><KPICard key={i} {...c} loading={loading}/>)}</div>;
}

function AlertBanner({summary}){
  const [expanded,setExpanded]=useState(false);const [dismissed,setDismissed]=useState(false);
  if(dismissed||!summary)return null;
  const c=summary.counts||{};const stuck=summary.stuck||[];
  const kyc=(c.kyc_pending||0)+(c.kyc_review||0);
  const nda=(c.nda_draft||0)+(c.nda_sent||0);
  const agr=(c.agreement_draft||0)+(c.agreement_sent||0);
  if(!stuck.length&&!kyc&&!nda&&!agr)return null;
  const isCrit=stuck.length>3;
  return <div className={`alert${isCrit?' crit':''}`}>
    <div className="alert-left">
      <div className="alert-icon">{isCrit?'🚨':'⚠️'}</div>
      <button className="alert-dismiss" onClick={()=>setDismissed(true)}>✕</button>
    </div>
    <div className="alert-body">
      <div className="alert-title">{isCrit?`${stuck.length} Deals Stuck — Immediate Action Required`:'Action Required Across Pipeline'}</div>
      <div className="chips">
        {stuck.length>0&&<span className="chip cw">⏰ {stuck.length} Stuck</span>}
        {kyc>0&&<span className="chip ci">📄 {kyc} KYC Pending</span>}
        {nda>0&&<span className="chip ci">✍ {nda} NDA Action</span>}
        {agr>0&&<span className="chip ci">📝 {agr} Agreement Action</span>}
        {(c.complete||0)>0&&<span className="chip cg">🎉 {c.complete} Complete</span>}
        {(c.overseas||0)>0&&<span className="chip cp">🌐 {c.overseas} Overseas</span>}
      </div>
      {stuck.length>0&&<>
        <button className="stuck-expand-btn" onClick={()=>setExpanded(!expanded)}>
          {expanded?'▲ Hide':'▼ Show'} stuck companies
        </button>
        {expanded&&<div className="stuck-list">
          {stuck.map((item,i)=>{
            const co=item?.company||item?.lead_business_name||item?.email||`Lead #${i+1}`;
            const age=item?.stuck_days||item?.days||'?';
            const stage=item?.stage||'unknown';
            const ageClr=parseInt(age)>14?'var(--red)':parseInt(age)>7?'var(--amber)':'var(--green)';
            return <div key={i} className="stuck-item">
              <span className="stuck-co">{co}</span>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:10,color:'var(--text4)',textTransform:'capitalize'}}>{dispSt(stage)}</span>
                <span className="stuck-age" style={{background:ageClr+'22',color:ageClr}}>{age}d</span>
              </div>
            </div>;
          })}
        </div>}
      </>}
    </div>
  </div>;
}

function Funnel({stats}){
  const s=stats||{};const total=s.total_leads||1;
  const stages=[
    {lbl:'Total',n:s.total_leads||0,clr:'#1a56db'},
    {lbl:'Sent',n:s.sent_leads||0,clr:'#0891b2'},
    {lbl:'Replied',n:s.replied_leads||0,clr:'#d97706'},
    {lbl:'Booked',n:s.booked_leads||0,clr:'#059669'},
  ];
  return <div className="panel">
    <div className="ph"><div className="ph-title">📉 Pipeline Funnel</div></div>
    <div className="pb">
      {stages.map((st,i)=>{
        const w=Math.max(12,Math.round(st.n/total*100));
        const drop=i>0?Math.round(st.n/(stages[i-1].n||1)*100):null;
        const dropClr=drop<40?'var(--red)':drop<70?'var(--amber)':'var(--green)';
        return <div key={i} className="f-row">
          <div className="f-lbl">{st.lbl}</div>
          <div className="f-track">
            <div className="f-fill" style={{width:w+'%',background:`linear-gradient(90deg,${st.clr},${hexToRgba(st.clr,.7)})`}}>
              <span>{fmtN(st.n)}</span>
            </div>
          </div>
          <div className="f-n">{fmtN(st.n)}</div>
          <div className="f-drop" style={{color:drop!=null?dropClr:'transparent'}}>{drop!=null?drop+'%':''}</div>
        </div>;
      })}
      <div style={{marginTop:10,padding:'8px 10px',background:'var(--surface2)',borderRadius:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--text3)'}}>End-to-end Conversion</span>
        <span style={{fontSize:14,fontWeight:900,color:parseFloat(s.conversion_rate||0)>10?'var(--green)':'var(--amber)'}}>{fmtP(s.conversion_rate)}</span>
      </div>
    </div>
  </div>;
}

function RecentActivity({summary}){
  const items=summary?.recent_complete||[];
  return <div className="panel">
    <div className="ph">
      <div className="ph-title">🎉 Recent Completions</div>
      <span className="ph-badge green">{items.length}</span>
    </div>
    <div className="pb">
      {!items.length
        ?<div className="empty"><div className="empty-icon">📭</div><p>No completions yet</p></div>
        :<div className="activity-feed">
          {items.map((item,i)=>{
            const co=item?.company||item?.lead_business_name||item?.email||`Record ${i+1}`;
            const age=daysAgo(item?.completed_at||item?.updated_at);
            return <div key={i} className="activity-item">
              <div className="activity-dot complete">🎉</div>
              <div className="activity-body">
                <div className="activity-co">{co}</div>
                <div className="activity-sub">Fully onboarded · Agreement signed</div>
              </div>
              <div className="activity-time">{age!=null?age===0?'Today':`${age}d ago`:'—'}</div>
            </div>;
          })}
        </div>}
    </div>
  </div>;
}

function Badge({status}){return <span className={`badge ${badgeCls(status)}`}><span className="bd"/>{dispSt(status)||'N/A'}</span>}
function ScoreBar({n}){
  const w=Math.round(((n||0)/11)*100);
  return <div className="srow"><div className="sbg"><div className="sfill" style={{width:w+'%',background:scoreClr(n||0)}}/></div><div className="sn">{n||0}</div></div>;
}

function ConfirmModal({msg,onConfirm,onCancel,type='ok'}){
  return <div className="modal-overlay" onClick={onCancel}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <h3>{type==='ok'?'Confirm Approval':'Confirm Rejection'}</h3>
      <p>{msg}</p>
      <div className="modal-actions">
        <button className="modal-btn cancel" onClick={onCancel}>Cancel</button>
        <button className={`modal-btn confirm-${type}`} onClick={onConfirm}>{type==='ok'?'✓ Approve':'✗ Reject'}</button>
      </div>
    </div>
  </div>;
}

const PAGE_SIZE=20;
function OBSection({onboarding,loading,toast,globalSearch}){
  const [search,setSearch]=useState('');
  const [tab,setTab]=useState('all');
  const [sortCol,setSortCol]=useState('age');const [sortDir,setSortDir]=useState('desc');
  const [page,setPage]=useState(1);
  const [confirm,setConfirm]=useState(null);

  useEffect(()=>{if(globalSearch)setSearch(globalSearch)},[globalSearch]);

  const q=(search||globalSearch||'').toLowerCase();
  const filtered=useMemo(()=>onboarding.filter(r=>{
    const m=!q||(r.lead_business_name||'').toLowerCase().includes(q)||(r.lead_email||'').toLowerCase().includes(q)||(r.lead_contact_name||'').toLowerCase().includes(q);
    if(!m)return false;
    if(tab==='action')return !!r.pending_action;
    if(tab==='kyc')return (r.kyc_status||'').includes('review');
    if(tab==='nda')return (r.nda_status||'').includes('review')||(r.nda_status||'').includes('signed');
    if(tab==='complete')return (r.agreement_status||'').toLowerCase().includes('complet');
    return true;
  }),[onboarding,q,tab]);

  const sorted=useMemo(()=>[...filtered].sort((a,b)=>{
    let av,bv;
    if(sortCol==='age'){av=new Date(a.created_at||0);bv=new Date(b.created_at||0);}
    else if(sortCol==='score'){av=a.stage_score||0;bv=b.stage_score||0;}
    else if(sortCol==='company'){av=(a.lead_business_name||'').toLowerCase();bv=(b.lead_business_name||'').toLowerCase();}
    else{av=0;bv=0;}
    if(av<bv)return sortDir==='asc'?-1:1;
    if(av>bv)return sortDir==='asc'?1:-1;
    return 0;
  }),[filtered,sortCol,sortDir]);

  const pageCount=Math.ceil(sorted.length/PAGE_SIZE);
  const paged=sorted.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  const doSort=col=>{if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(col);setSortDir('desc');}setPage(1);};

  const doAction=async(row,type,action)=>{
    let url;
    if(type==='kyc')url=`${BASE}/onboarding/kyc/review/${row.id}`;
    else if(type==='nda')url=`${BASE}/onboarding/nda/sign-review/${row.id}`;
    else url=`${BASE}/onboarding/agreement/sign-review/${row.id}`;
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,notes:''})});
      toast.fire(r.ok?`${type.toUpperCase()} ${action}d ✓`:'Action failed',r.ok?'success':'error');
    }catch{toast.fire('Network error','error');}
    setConfirm(null);
  };

  const promptAction=(row,type,action)=>{
    const co=row.lead_business_name||row.lead_email||'this lead';
    setConfirm({msg:`${action==='approve'?'Approve':'Reject'} ${type.toUpperCase()} for ${co}?`,onConfirm:()=>doAction(row,type,action),type:action==='approve'?'ok':'no'});
  };

  const exportCSV=()=>{
    const headers=['Company','Email','Contact','Type','KYC','NDA','Agreement','Score','Age (days)'];
    const rows=sorted.map(r=>[r.lead_business_name||'',r.lead_email||'',r.lead_contact_name||'',r.company_type||'',r.kyc_status||'',r.nda_status||'',r.agreement_status||'',r.stage_score||0,daysAgo(r.created_at)||0].map(v=>`"${v}"`).join(','));
    const csv=[headers.join(','),...rows].join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download=`onboarding_${new Date().toISOString().split('T')[0]}.csv`;a.click();
    toast.fire('CSV exported','success');
  };

  const actionCount=onboarding.filter(r=>r.pending_action).length;
  const kycCount=onboarding.filter(r=>(r.kyc_status||'').includes('review')).length;
  const tabs=[
    {id:'all',lbl:`All (${onboarding.length})`},
    {id:'action',lbl:`Action Needed${actionCount?` (${actionCount})`:''}`,hot:actionCount>0},
    {id:'kyc',lbl:`KYC${kycCount?` (${kycCount})`:''}`,hot:kycCount>0},
    {id:'nda',lbl:'NDA'},
    {id:'complete',lbl:'Complete'},
  ];
  const th=(label,col)=>{
    const active=sortCol===col;
    return <th className={active?'sorted':''} onClick={()=>doSort(col)}>
      {label}<span className="sort-icon">{active?(sortDir==='asc'?'↑':'↓'):'↕'}</span>
    </th>;
  };

  return <>
    {confirm&&<ConfirmModal {...confirm} onCancel={()=>setConfirm(null)}/>}
    <div className="panel">
      <div className="ph">
        <div className="ph-title">🏢 Onboarding Pipeline</div>
        <span className="ph-badge">{fmtN(onboarding.length)}</span>
        <button className="qb-btn" style={{marginLeft:8,padding:'4px 10px'}} onClick={exportCSV}>⬇ CSV</button>
      </div>
      <div className="toolbar">
        <div className="seg">
          {tabs.map(t=>(
            <button key={t.id} className={`seg-btn${tab===t.id?' on':''}${t.hot&&tab!==t.id?' hot':''}`}
              onClick={()=>{setTab(t.id);setPage(1);}}>
              {t.lbl}
            </button>
          ))}
        </div>
        <div className="tbl-search">
          <span style={{color:'var(--text4)',fontSize:12}}>🔍</span>
          <input placeholder="Company, email or contact…" value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/>
          {search&&<span style={{cursor:'pointer',color:'var(--text4)',fontSize:13}} onClick={()=>{setSearch('');setPage(1);}}>✕</span>}
        </div>
        <span className="tbl-count">{sorted.length} record{sorted.length!==1?'s':''}</span>
      </div>
      {loading?(
        <div style={{padding:14}}>{[1,2,3,4,5].map(i=><div key={i} className="sk sk-row"/>)}</div>
      ):paged.length===0?(
        <div className="empty"><div className="empty-icon">📭</div><p>No records match</p></div>
      ):(
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              {th('Company / Contact','company')}
              <th>Type</th><th>KYC</th><th>NDA</th><th>Agreement</th>
              {th('Score','score')}
              {th('Age','age')}
              <th>Actions</th>
            </tr></thead>
            <tbody>
              {paged.map((r,i)=>{
                const kyc=r.kyc_status||'N/A';const nda=r.nda_status||'N/A';const agr=r.agreement_status||'N/A';
                const needKyc=kyc.includes('review');const needNda=nda.includes('review')||nda.includes('signed');const needAgr=agr.includes('review')||agr.includes('signed');
                const age=daysAgo(r.created_at);const ageClr=age>14?'var(--red)':age>7?'var(--amber)':'var(--green)';
                return <tr key={r.id||i}>
                  <td>
                    <div className="co">{r.lead_business_name||'—'}</div>
                    <div className="co-sub">{r.lead_contact_name||''}</div>
                    <div className="co-em">{r.lead_email||''}</div>
                  </td>
                  <td><span style={{fontSize:10,fontWeight:600,textTransform:'capitalize',padding:'2px 7px',background:'var(--surface2)',color:'var(--text3)',borderRadius:4,border:'1px solid var(--border)'}}>{r.company_type||'unknown'}</span></td>
                  <td><Badge status={kyc}/></td>
                  <td><Badge status={nda}/></td>
                  <td><Badge status={agr}/></td>
                  <td style={{minWidth:90}}><ScoreBar n={r.stage_score}/></td>
                  <td><span style={{fontSize:11,fontWeight:800,color:ageClr}}>{age!=null?age+'d':'—'}</span></td>
                  <td>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                      {needKyc&&<><button className="act a-ok" onClick={()=>promptAction(r,'kyc','approve')}>✓ KYC</button>
                        <button className="act a-no" onClick={()=>promptAction(r,'kyc','reject')}>✗</button></>}
                      {needNda&&<button className="act a-ok" onClick={()=>promptAction(r,'nda','approve')}>✓ NDA</button>}
                      {needAgr&&<button className="act a-ok" onClick={()=>promptAction(r,'agr','approve')}>✓ Agr</button>}
                      {!needKyc&&!needNda&&!needAgr&&(
                        <span style={{fontSize:10,color:'var(--text4)',fontStyle:'italic'}}>
                          {agr.toLowerCase().includes('complet')?'✅ Done':'Waiting…'}
                        </span>
                      )}
                    </div>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      )}
      {pageCount>1&&<div className="pagination">
        <button className="pg-btn" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>← Prev</button>
        {Array.from({length:Math.min(pageCount,7)},(_,i)=>{
          const pg=pageCount<=7?i+1:(page<=4?i+1:page-3+i);
          if(pg<1||pg>pageCount)return null;
          return <button key={pg} className={`pg-btn${page===pg?' on':''}`} onClick={()=>setPage(pg)}>{pg}</button>;
        })}
        <button className="pg-btn" disabled={page>=pageCount} onClick={()=>setPage(p=>p+1)}>Next →</button>
        <span className="pg-info">Page {page} of {pageCount} · {sorted.length} total</span>
      </div>}
    </div>
  </>;
}

function PipelineView({stats,summary,onboarding,abStats,loading,toast,globalSearch}){
  return <>
    <KPIGrid stats={stats} summary={summary} loading={loading}/>
    {!loading&&<AlertBanner summary={summary}/>}
    <div className="three-col">
      <Funnel stats={stats}/>
      <div className="panel">
        <div className="ph"><div className="ph-title">🍩 Pipeline Distribution</div></div>
        <div className="pb">{loading?<div className="sk sk-panel"/>:<DoughnutChart stats={stats}/>}</div>
      </div>
      <div className="panel">
        <div className="ph"><div className="ph-title">🧪 A/B Performance</div></div>
        <div className="pb">{loading?<div className="sk sk-panel"/>:<ABBarChart abStats={abStats}/>}</div>
      </div>
    </div>
    <div className="two-col">
      <RecentActivity summary={summary}/>
      <div className="panel">
        <div className="ph"><div className="ph-title">📊 Pipeline at a Glance</div></div>
        <div className="pb">
          {[
            {lbl:'Send Coverage',a:stats?.total_leads,b:stats?.sent_leads,clr:'#0891b2'},
            {lbl:'Reply Rate',a:stats?.sent_leads,b:stats?.replied_leads,clr:'#d97706'},
            {lbl:'Booking Rate',a:stats?.replied_leads,b:stats?.booked_leads,clr:'#059669'},
            {lbl:'Onboarding Start',a:stats?.booked_leads,b:summary?.total,clr:'#1a56db'},
            {lbl:'Completion Rate',a:summary?.total,b:(summary?.counts||{}).complete,clr:'#7c3aed'},
          ].map((st,i)=>{
            const p=st.a?Math.round(((st.b||0)/st.a)*100):0;
            return <div key={i} className="cv-row">
              <div className="cv-hdr">
                <span className="cv-lbl">{st.lbl}</span>
                <span className="cv-pct" style={{color:p>60?'#059669':p>30?'#d97706':'#dc2626'}}>{p}%</span>
              </div>
              <div className="cv-bar"><div className="cv-fill" style={{width:p+'%',background:st.clr}}/></div>
            </div>;
          })}
        </div>
      </div>
    </div>
    <OBSection onboarding={onboarding} loading={loading} toast={toast} globalSearch={globalSearch}/>
  </>;
}

function AnalyticsView({abStats,stats,summary}){
  const s=stats||{};const sm=summary||{};const c=sm.counts||{};
  const obCells=[
    {lbl:'KYC Pending',val:c.kyc_pending,clr:'#d97706'},{lbl:'KYC Review',val:c.kyc_review,clr:'#1a56db'},
    {lbl:'KYC Approved',val:c.kyc_approved,clr:'#059669'},{lbl:'NDA Draft',val:c.nda_draft,clr:'#64748b'},
    {lbl:'NDA Sent',val:c.nda_sent,clr:'#0891b2'},{lbl:'NDA Signed',val:c.nda_signed,clr:'#059669'},
    {lbl:'Agr Draft',val:c.agreement_draft,clr:'#64748b'},{lbl:'Agr Sent',val:c.agreement_sent,clr:'#0891b2'},
    {lbl:'Agr Signed',val:c.agreement_signed,clr:'#059669'},{lbl:'Complete',val:c.complete,clr:'#059669'},
    {lbl:'Indian',val:c.indian,clr:'#f97316'},{lbl:'Overseas',val:c.overseas,clr:'#7c3aed'},
  ];
  return <>
    <div className="two-col">
      <div className="panel">
        <div className="ph"><div className="ph-title">🧪 A/B Test — Sent vs Replied</div></div>
        <div className="pb"><ABBarChart abStats={abStats}/></div>
      </div>
      <div className="panel">
        <div className="ph"><div className="ph-title">🍩 Pipeline Distribution</div></div>
        <div className="pb"><DoughnutChart stats={stats}/></div>
      </div>
    </div>
    <div className="panel">
      <div className="ph"><div className="ph-title">📊 Stage-by-Stage Conversion</div></div>
      <div className="pb">
        {[
          {lbl:'Leads → Email Sent',a:s.total_leads,b:s.sent_leads,clr:'#0891b2'},
          {lbl:'Sent → Replied',a:s.sent_leads,b:s.replied_leads,clr:'#d97706'},
          {lbl:'Replied → Booked',a:s.replied_leads,b:s.booked_leads,clr:'#059669'},
          {lbl:'Booked → Onboarding',a:s.booked_leads,b:sm.total,clr:'#1a56db'},
          {lbl:'Onboarding → Complete',a:sm.total,b:c.complete,clr:'#7c3aed'},
        ].map((st,i)=>{
          const p=st.a?Math.round(((st.b||0)/st.a)*100):0;
          return <div key={i} className="cv-row">
            <div className="cv-hdr">
              <span className="cv-lbl">{st.lbl}</span>
              <span className="cv-pct" style={{color:p>50?'#059669':p>25?'#d97706':'#dc2626'}}>{p}%</span>
            </div>
            <div className="cv-bar"><div className="cv-fill" style={{width:p+'%',background:st.clr}}/></div>
          </div>;
        })}
      </div>
    </div>
    <div className="panel">
      <div className="ph"><div className="ph-title">📋 Onboarding Stage Breakdown</div></div>
      <div className="pb">
        <div className="ob-grid">
          {obCells.map((x,i)=>(
            <div key={i} className="ob-cell">
              <div className="ob-cell-v" style={{color:x.clr}}>{fmtN(x.val||0)}</div>
              <div className="ob-cell-l">{x.lbl}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  </>;
}

function App(){
  const [tab,setTab]=useState('pipeline');
  const [darkMode,setDarkMode]=useState(()=>localStorage.getItem('jane-dark')==='1');
  const [globalSearch,setGlobalSearch]=useState('');
  const {stats,summary,onboarding,abStats,loading,refresh,lastRefresh}=useData();
  const toast=useToast();

  useEffect(()=>{
    document.documentElement.dataset.theme=darkMode?'dark':'light';
    localStorage.setItem('jane-dark',darkMode?'1':'0');
  },[darkMode]);

  useEffect(()=>{
    const fn=e=>{
      if(e.target.tagName==='INPUT')return;
      if(e.key==='r'||e.key==='R')refresh();
      if(e.key==='1')setTab('pipeline');
      if(e.key==='2')setTab('onboarding');
      if(e.key==='3')setTab('analytics');
    };
    window.addEventListener('keydown',fn);return()=>window.removeEventListener('keydown',fn);
  },[refresh]);

  const alertCount=(summary?.stuck||[]).length+onboarding.filter(r=>r.pending_action).length;

  const handleSync=async()=>{
    try{
      const r=await fetch(`${BASE}/v2/sync-sheet`,{method:'POST'});
      toast.fire(r.ok?'Sheets sync triggered ✓':'Sync failed',r.ok?'success':'error');
    }catch{toast.fire('Network error','error');}
  };

  const handleExport=()=>{
    const headers=['Company','Email','Contact','Type','KYC','NDA','Agreement','Score','Age'];
    const rows=onboarding.map(r=>[r.lead_business_name||'',r.lead_email||'',r.lead_contact_name||'',r.company_type||'',r.kyc_status||'',r.nda_status||'',r.agreement_status||'',r.stage_score||0,daysAgo(r.created_at)||0].map(v=>`"${v}"`).join(','));
    const csv=[headers.join(','),...rows].join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download=`pipeline_${new Date().toISOString().split('T')[0]}.csv`;a.click();
    toast.fire('Export complete','success');
  };

  return <div className="shell">
    <Sidebar active={tab} setActive={setTab} onboarding={onboarding}/>
    <div className="body">
      <Header loading={loading} lastRefresh={lastRefresh} onRefresh={refresh}
        alertCount={alertCount} darkMode={darkMode} toggleDark={()=>setDarkMode(!darkMode)}/>
      <QuickBar globalSearch={globalSearch} setGlobalSearch={setGlobalSearch}
        onSync={handleSync} onExport={handleExport} loading={loading}/>
      <main className="content">
        {tab==='pipeline'&&<PipelineView stats={stats} summary={summary} onboarding={onboarding}
          abStats={abStats} loading={loading} toast={toast} globalSearch={globalSearch}/>}
        {tab==='onboarding'&&<OBSection onboarding={onboarding} loading={loading} toast={toast} globalSearch={globalSearch}/>}
        {tab==='analytics'&&<AnalyticsView abStats={abStats} stats={stats} summary={summary}/>}
      </main>
    </div>
    <div className={`toast${toast.on?' on':''} ${toast.type}`}>{toast.msg}</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
