<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(16,185,129,0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59,130,246,0.04) 0%, transparent 40%);
        }
        .container { width: 100%; max-width: 480px; animation: fadeIn 0.6s ease forwards; }
        .card {
            background: rgba(17,24,39,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 48px 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #10b981, #047857);
        }
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px; height: 68px;
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.25);
            border-radius: 50%;
            margin-bottom: 24px;
            color: #10b981;
            animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
        }
        h1 {
            font-size: 26px; font-weight: 600; margin-bottom: 12px;
            background: linear-gradient(135deg,#fff 0%,#cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .message { font-size: 15px; color: #94a3b8; line-height: 1.7; margin-bottom: 8px; }
        .email-highlight {
            display: inline-block;
            margin-top: 12px;
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            color: #93c5fd;
            font-weight: 500;
        }
        .note {
            margin-top: 32px;
            font-size: 12px;
            color: #475569;
            line-height: 1.6;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
        @keyframes scaleIn { from { opacity:0; transform:scale(0.6) } to { opacity:1; transform:scale(1) } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h1>You're All Set!</h1>
            <p class="message">
                Thanks for submitting your details.<br>
                We've sent a <strong>booking link</strong> to your email:
            </p>
            <div class="email-highlight">{{ email }}</div>
            <p class="note">
                Please check your inbox (and spam folder) for an email from us with the meeting link.<br>
                Click the link in the email to choose a time slot that works for you.
            </p>
        </div>
    </div>
</body>
</html>
