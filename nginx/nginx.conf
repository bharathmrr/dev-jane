# Reverse proxy for the FastAPI app. TLS termination is typically handled by a
# load balancer in front of this in production; an HTTPS server block is shown
# commented for single-host deployments.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream scheduler_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Metrics endpoint should not be public — block at the edge.
    location /metrics {
        deny all;
        return 403;
    }

    location /health/ {
        proxy_pass http://scheduler_api;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://scheduler_api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

