# Reverse proxy for the FastAPI app.
# Uses Docker's internal DNS resolver (127.0.0.11) so that nginx always
# picks up the correct container IP even after a `docker compose restart api`.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS — re-resolves service names dynamically.
    # valid=5s means it re-checks every 5 seconds instead of caching forever.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Security headers
    # SAMEORIGIN (not DENY) — the document editor and signing pages embed our
    # own PDF endpoints in same-origin iframes.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Metrics endpoint should not be public — block at the edge.
    location /metrics {
        deny all;
        return 403;
    }

    location /health/ {
        proxy_pass $api_upstream;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

